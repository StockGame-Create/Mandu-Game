<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>말랑이 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E4;
    --paper:#FFFDF8;
    --ink:#2B2420;
    --ink-soft:#6b6156;
    --line:#E7DCC7;
    --bamboo:#6B8F71;
    --bamboo-dark:#4f6d55;
    --chili:#C1440E;
    --chili-dark:#9c360b;
    --gold:#E0A458;
    --common:#7C9885;
    --common-bg:#EAF1EC;
    --rare:#3E7CB1;
    --rare-bg:#E7F1FA;
    --legend:#C1440E;
    --legend-bg:#FBEAE0;
    --shadow: 0 4px 14px rgba(43,36,32,0.10);
    /* 단계별 테마 색상 - JS에서 단계가 바뀔 때마다 덮어씌워짐 */
    --stage-a:#6B8F71;
    --stage-b:#4f6d55;
    --stage-bg:#FAF3E4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;
    overflow:hidden;               /* 바깥(뷰포트) 스크롤/바운스 차단 */
    overscroll-behavior:none;      /* 당겨서 새로고침 등 브라우저 제스처 차단 */
    touch-action:pan-y;            /* 세로 스크롤은 허용하되 핀치줌은 차단 */
    -webkit-text-size-adjust:100%;
  }
  body{
    background:
      radial-gradient(circle at 15% 0%, #fff8ec 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    position:fixed;
    inset:0;
    width:100%;
  }
  h1,h2,h3, .display{ font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; }
  #app{
    max-width:720px; margin:0 auto;
    padding:14px 14px calc(84px + env(safe-area-inset-bottom));
    height:100%;
    overflow-y:auto;               /* 실제 콘텐츠 스크롤은 #app 내부에서만 */
    overflow-x:hidden;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 4px 12px;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .badge-dot{ width:10px;height:10px;border-radius:50%; background:var(--chili); box-shadow:0 0 0 3px var(--legend-bg);}
  .brand h1{ font-size:22px; margin:0; letter-spacing:0.5px; color:var(--ink); }
  .brand .sub{ font-size:11px; color:var(--ink-soft); margin-top:-2px; }
  .stats{ display:flex; gap:8px; }
  .stat-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 12px 6px 8px; box-shadow:var(--shadow); font-weight:700; font-size:14px;
    white-space:nowrap;
  }
  .stat-pill .ic{ color:var(--gold); display:flex; }
  .stat-pill.ticket .ic{ color:var(--chili); }

  .stage-strip{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(90deg, var(--stage-a), var(--stage-b));
    color:#fff; border-radius:14px; padding:10px 16px; margin-bottom:14px;
    box-shadow:var(--shadow); transition:background .4s ease;
  }
  .stage-strip .st-title{ font-family:'Jua'; font-size:16px; }
  .stage-strip .st-desc{ font-size:11.5px; opacity:0.85; margin-top:2px;}
  .stage-strip .st-num{
    font-family:'Jua'; font-size:26px; background:rgba(255,255,255,0.18);
    border-radius:10px; padding:2px 12px;
  }

  /* ---------- Hero: steamer ---------- */
  .hero{
    position:relative;
    background: var(--paper);
    border:1.5px solid var(--line);
    border-radius:22px;
    padding:26px 20px 18px;
    text-align:center;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:14px;
  }
  .hero::before{ /* woven bamboo rim */
    content:'';
    position:absolute; left:0; right:0; top:0; height:10px;
    background: repeating-linear-gradient(90deg, var(--bamboo) 0 10px, var(--bamboo-dark) 10px 20px);
    opacity:0.9;
  }
  .steam-wrap{ position:relative; height:60px; margin-bottom:-18px; }
  .steam-puff{
    position:absolute; bottom:0; width:16px; height:26px; border-radius:50%;
    background:rgba(255,255,255,0.85); filter:blur(5px);
    animation:steamRise 3.2s ease-in infinite;
  }
  @keyframes steamRise{
    0%{ transform:translateY(0) scale(0.8); opacity:0; }
    18%{ opacity:0.55; }
    100%{ transform:translateY(-70px) scale(1.7); opacity:0; }
  }
  .basket{
    position:relative; width:220px; height:190px; margin:0 auto;
  }
  .basket-ring{
    position:absolute; left:50%; top:100%; transform:translate(-50%,-14px);
    width:230px; height:26px; border-radius:50%;
    background: repeating-linear-gradient(90deg, var(--stage-a) 0 8px, var(--stage-b) 8px 16px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.06); transition:background .4s ease;
  }
  .dumpling-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; /* 더블탭 확대만 차단, click 이벤트/연타는 그대로 즉시 통과 */
  }
  .hero-backdrop{
    position:absolute; width:180px; height:180px; border-radius:50%;
    background: var(--stage-bg);
    box-shadow: 0 14px 22px -6px rgba(43,36,32,0.28), inset 0 0 0 1px rgba(43,36,32,0.04);
    transition:background .4s ease;
  }
  .dumpling-wrap img{
    position:relative; width:172px; height:172px; object-fit:contain;
    mix-blend-mode:multiply; border-radius:50%; overflow:hidden;
    transition: transform .15s ease;
  }
  .dumpling-wrap:active img{ transform:scale(0.97); }
  @keyframes squish{
    0%{ transform:scale(1); }
    28%{ transform:scale(0.82,1.18); }
    52%{ transform:scale(1.12,0.9); }
    75%{ transform:scale(0.95,1.05); }
    100%{ transform:scale(1); }
  }
  .squish{ animation: squish .38s ease; }
  .hero-hint{ margin-top:8px; font-size:12px; color:var(--ink-soft); }
  .float-layer{ position:absolute; inset:0; pointer-events:none; }
  .float-coin{
    position:absolute; font-family:'Jua'; font-weight:400; color:var(--chili);
    font-size:16px; animation: floatUp .9s ease-out forwards; pointer-events:none;
  }
  .float-coin.crit{ color:var(--gold); font-size:22px; text-shadow:0 0 8px rgba(224,164,88,0.6); }
  @keyframes floatUp{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(-64px); opacity:0; }
  }
  .per-click{ position:absolute; top:10px; right:16px; font-size:11px; color:var(--ink-soft); background:var(--common-bg); border-radius:8px; padding:3px 8px;}

  /* ---------- Tabs (bottom fixed nav) ---------- */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    display:flex; gap:6px;
    max-width:720px; margin:0 auto;
    background:rgba(255,253,248,0.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1.5px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(43,36,32,0.10);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:transparent; border:none; border-radius:12px;
    padding:6px 4px 5px; font-family:'Noto Sans KR'; font-weight:700; font-size:10.5px;
    color:var(--ink-soft); cursor:pointer; transition:all .15s ease; touch-action:manipulation;
  }
  .tab-btn svg{ width:19px; height:19px; transition:transform .15s ease; }
  .tab-btn.active{ background:var(--ink); color:#fff; box-shadow:var(--shadow); }
  .tab-btn.active svg{ transform:translateY(-1px) scale(1.05); }
  .tab-btn:active svg{ transform:scale(0.9); }

  .panel{
    background:var(--paper); border:1.5px solid var(--line); border-radius:18px;
    padding:16px; box-shadow:var(--shadow); min-height:200px;
  }
  .panel h2{ margin:0 0 4px; font-size:18px; }
  .panel .lead{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  /* ---------- Gacha cards ---------- */
  .gacha-card{
    display:flex; flex-direction:column; gap:10px;
    border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    background:linear-gradient(180deg, #fff, #fffaf1);
  }
  .gacha-card-top{ display:flex; align-items:center; gap:14px; }
  .g-actions{ display:flex; gap:8px; }
  .g-actions .btn{ flex:1; }
  .btn-sm{ font-size:11px; padding:8px 6px; white-space:normal; line-height:1.3; }
  .gacha-card .g-icon{
    width:52px;height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--common-bg); color:var(--bamboo-dark); flex-shrink:0;
  }
  .gacha-card.ticket .g-icon{ background:var(--legend-bg); color:var(--chili); }
  .gacha-card.ticket.legend .g-icon{ background:linear-gradient(135deg,var(--gold),var(--chili)); color:#fff; }
  .gacha-card .g-owned{ font-weight:700; font-size:10.5px; color:var(--ink-soft); background:var(--common-bg); border-radius:999px; padding:1px 8px; margin-left:6px; }
  .mileage-strip{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .mileage-pill{
    display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    border-radius:999px; padding:6px 12px; background:var(--common-bg); color:var(--common);
  }
  .mileage-pill.rare{ background:var(--rare-bg); color:var(--rare); }
  .mileage-pill b{ color:var(--ink); font-family:'Jua'; font-weight:400; }

  /* ---------- Gacha category hamburger menu ---------- */
  .gacha-cat-select{ position:relative; margin-bottom:12px; }
  .cat-hamburger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:#fff;
    font-family:'Noto Sans KR'; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
    box-shadow:var(--shadow);
  }
  .cat-hb-left{ display:flex; align-items:center; gap:10px; }
  .cat-hamburger svg{ flex-shrink:0; color:var(--stage-a); }
  .cat-menu{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:60;
    background:var(--paper); border:1.5px solid var(--line); border-radius:16px;
    box-shadow:0 14px 30px rgba(43,36,32,0.18); padding:8px; max-height:280px; overflow-y:auto;
    display:none;
  }
  .cat-menu.open{ display:block; }
  .cat-menu-item{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 12px; border-radius:12px; border:none; background:transparent;
    font-family:'Noto Sans KR'; font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer;
    text-align:left;
  }
  .cat-menu-item:not(:last-child){ margin-bottom:2px; }
  .cat-menu-item:hover{ background:var(--common-bg); }
  .cat-menu-item.active{ background:var(--stage-a); color:#fff; }
  .cat-item-tag{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; background:rgba(0,0,0,0.08); }
  .cat-menu-item.active .cat-item-tag{ background:rgba(255,255,255,0.25); }
  .cat-item-tag.past{ background:var(--legend-bg); color:var(--legend); }
  .cat-menu-item.active .cat-item-tag.past{ background:rgba(255,255,255,0.25); color:#fff; }

  /* ---------- Coin shortage warning ---------- */
  .coin-warning{
    display:flex; align-items:flex-start; gap:10px; background:#FDE8E4; color:#8a2f10;
    border:1.5px solid var(--chili); border-radius:14px; padding:12px 14px; margin-bottom:12px;
    font-size:12.5px; font-weight:700; line-height:1.5;
  }
  .coin-warning svg{ flex-shrink:0; color:var(--chili); margin-top:1px; }

  /* ---------- Mileage board (bigger, per-category) ---------- */
  .mileage-board{
    background:linear-gradient(135deg, var(--stage-bg), #fff);
    border:1.5px solid var(--line); border-radius:18px; padding:14px 16px 16px; margin-bottom:14px;
    box-shadow:var(--shadow); transition:background .4s ease;
  }
  .mb-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .mb-row{ display:flex; gap:10px; }
  .mb-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 10px;
  }
  .mb-item svg{ width:18px; height:18px; margin-bottom:2px; }
  .mb-item.common svg{ color:var(--common); }
  .mb-item.rare svg{ color:var(--rare); }
  .mb-item.legendary svg{ color:var(--legend); }
  .mb-num{ font-family:'Jua'; font-size:28px; line-height:1; color:var(--ink); }
  .mb-item.common .mb-num{ color:var(--common); }
  .mb-item.rare .mb-num{ color:var(--rare); }
  .mb-item.legendary .mb-num{ color:var(--legend); }
  .mb-label{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:2px; }

  .gacha-card .g-body{ flex:1; }
  .gacha-card .g-title{ font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .gacha-card .g-odds{ font-size:11px; color:var(--ink-soft); }
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-weight:700; font-size:13px;
    cursor:pointer; font-family:'Noto Sans KR'; transition:transform .1s ease, opacity .15s;
    white-space:nowrap; touch-action:manipulation;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--chili); color:#fff; }
  .btn-primary:disabled{ background:#d8cfc0; color:#948a7c; cursor:not-allowed; }
  .btn-ghost{ background:var(--ink); color:#fff; }
  .btn-ghost:disabled{ background:#d8cfc0; color:#948a7c; cursor:not-allowed; }
  .btn-outline{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }

  .craft-row{
    display:flex; align-items:center; gap:12px; border:1.5px dashed var(--line);
    border-radius:14px; padding:12px 14px;
  }
  .craft-row .prog{ flex:1; }
  .prog-bar{ height:8px; background:var(--common-bg); border-radius:999px; overflow:hidden; margin-top:6px;}
  .prog-fill{ height:100%; background:var(--bamboo); border-radius:999px; transition:width .3s ease;}

  /* ---------- Dex ---------- */
  .dex-tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .dex-tab{
    font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .dex-tab.active{ background:var(--bamboo); color:#fff; border-color:var(--bamboo); }
  .dex-progress{ font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
  .dex-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:10px;
  }
  .dex-item{
    border:1.5px solid var(--line); border-radius:12px; padding:8px 6px 10px; text-align:center;
    background:#fff; position:relative;
  }
  .dex-thumb-wrap{ position:relative; width:56px; height:56px; margin:0 auto 6px; }
  .thumb-circle{ position:relative; z-index:2; }
  .blend-photo{ mix-blend-mode:multiply; }
  .lock-badge{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; color:#fff; }
  .ring{ position:absolute; inset:-4px; border-radius:50%; z-index:1; }
  .ring.rare{ background:conic-gradient(from 0deg, var(--rare), #a9d8ff, var(--rare)); animation:spin 3s linear infinite; opacity:0.9;}
  .ring.legendary{ background:conic-gradient(from 0deg, var(--gold), var(--chili), var(--gold)); animation:spin 2.2s linear infinite; opacity:0.95;}
  /* 무지개 퓨즈 스킨: 12색을 모두 도는 링 + 이미지 자체도 12단계로 색이 바뀜 */
  .ring.rainbow{
    background:conic-gradient(from 0deg,
      #FF0000,#FF7F00,#FFD400,#CFFF00,#4CD964,#00E0A8,
      #00C2FF,#3E7CFF,#7A5CFF,#C24CFF,#FF4CD8,#FF0000);
    animation:spin 3.4s linear infinite; opacity:0.95;
  }
  @keyframes rainbow12{
    0%{ filter:hue-rotate(0deg) saturate(3) brightness(1.08); }
    8.33%{ filter:hue-rotate(30deg) saturate(3) brightness(1.08); }
    16.66%{ filter:hue-rotate(60deg) saturate(3) brightness(1.08); }
    25%{ filter:hue-rotate(90deg) saturate(3) brightness(1.08); }
    33.33%{ filter:hue-rotate(120deg) saturate(3) brightness(1.08); }
    41.66%{ filter:hue-rotate(150deg) saturate(3) brightness(1.08); }
    50%{ filter:hue-rotate(180deg) saturate(3) brightness(1.08); }
    58.33%{ filter:hue-rotate(210deg) saturate(3) brightness(1.08); }
    66.66%{ filter:hue-rotate(240deg) saturate(3) brightness(1.08); }
    75%{ filter:hue-rotate(270deg) saturate(3) brightness(1.08); }
    83.33%{ filter:hue-rotate(300deg) saturate(3) brightness(1.08); }
    91.66%{ filter:hue-rotate(330deg) saturate(3) brightness(1.08); }
    100%{ filter:hue-rotate(360deg) saturate(3) brightness(1.08); }
  }
  .rainbow-img{ animation: rainbow12 6s steps(12) infinite !important; }
  /* 4단계 퓨즈 스킨: 우주 별 이펙트 (별 반짝이는 배경 + 은은한 발광 펄스) */
  .ring.cosmic{
    background:
      radial-gradient(circle at 18% 26%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 72% 18%, #fff 0 1.4px, transparent 2.4px),
      radial-gradient(circle at 40% 78%, #fff 0 1.6px, transparent 2.6px),
      radial-gradient(circle at 84% 62%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 58% 46%, #fff 0 1.2px, transparent 2.2px),
      radial-gradient(circle at 14% 66%, #fff 0 1.2px, transparent 2.2px),
      radial-gradient(circle at 88% 88%, #fff 0 1.4px, transparent 2.4px),
      radial-gradient(circle, #3a2a7a, #0b0f2e 72%);
    animation: cosmicTwinkle 2.2s ease-in-out infinite alternate;
    opacity:0.95;
  }
  @keyframes cosmicTwinkle{ 0%{ opacity:0.7; } 100%{ opacity:1; filter:brightness(1.2); } }
  @keyframes cosmicPulse{
    0%{ filter:saturate(2.3) brightness(1.05) contrast(1.1); }
    50%{ filter:saturate(2.9) brightness(1.25) contrast(1.2); }
    100%{ filter:saturate(2.3) brightness(1.05) contrast(1.1); }
  }
  .cosmic-img{ animation: cosmicPulse 2.4s ease-in-out infinite !important; }
  /* 2n단계(짝수 단계) 퓨즈 스킨: 항상 은하계 테마 - 보라색과 하늘색이 겹쳐진 링 위에
     별가루가 뿌려지고, 이미지 자체도 화려하게 채도/밝기가 펄스침 */
  .ring.galaxy{
    background:
      radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 75% 20%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 45% 80%, #fff 0 1.8px, transparent 2.8px),
      radial-gradient(circle at 85% 65%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 15% 65%, #fff 0 1.3px, transparent 2.3px),
      radial-gradient(circle at 60% 45%, #fff 0 1.4px, transparent 2.4px),
      conic-gradient(from 0deg, #7A5CFF, #5AA9D6, #C24CFF, #5AA9D6, #7A5CFF);
    animation: spin 3.6s linear infinite, galaxyTwinkle 2s ease-in-out infinite alternate;
    opacity:0.95;
  }
  @keyframes galaxyTwinkle{ 0%{ opacity:0.75; } 100%{ opacity:1; filter:brightness(1.3) saturate(1.3); } }
  @keyframes galaxyPulse{
    0%{ filter:saturate(2.2) brightness(1.05) hue-rotate(260deg); }
    50%{ filter:saturate(2.9) brightness(1.25) hue-rotate(280deg); }
    100%{ filter:saturate(2.2) brightness(1.05) hue-rotate(260deg); }
  }
  .galaxy-img{ animation: galaxyPulse 2.6s ease-in-out infinite !important; }
  /* 먹색/흑진주처럼 아주 짙은 색 만두는 다른 만두들과 달리 바깥 테두리가 동그랗지 않고
     사각으로 각져있는 전용 프레임을 씀 (도감/퓨즈 도감 등 개수로 표시되는 모든 곳에 공통 적용) */
  .ring.ring-square{ border-radius:10px; background:linear-gradient(135deg,#3a332c,#000); opacity:0.9; animation:none; }
  /* 과일 만두: 색만 다른 게 아니라 과일 특유의 무늬(씨앗/줄무늬/과육 결 등)를 이미지 위에 겹쳐 보여줌.
     기존 opacity 0.6은 무늬가 너무 또렷하게 도장 찍힌 것처럼 보여서 훨씬 은은하게 비치도록 낮춤 */
  .fruit-overlay{
    position:absolute; inset:0; border-radius:50%;
    pointer-events:none; mix-blend-mode:soft-light; opacity:0.38;
  }
  .hero-fruit-overlay{
    position:absolute; width:172px; height:172px; top:50%; left:50%;
    transform:translate(-50%,-50%); border-radius:50%;
    pointer-events:none; mix-blend-mode:soft-light; opacity:0.38; display:none;
  }
  .reveal-fruit-overlay{
    position:absolute; inset:14px; border-radius:50%; z-index:3;
    pointer-events:none; mix-blend-mode:soft-light; opacity:0.38; display:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .dex-name{ font-size:11px; font-weight:700; margin-top:2px; line-height:1.2; }
  .dex-rarity{ font-size:9.5px; font-weight:700; border-radius:999px; padding:1px 7px; display:inline-block; margin-top:4px;}
  .dex-rarity.common{ background:var(--common-bg); color:var(--common); }
  .dex-rarity.rare{ background:var(--rare-bg); color:var(--rare); }
  .dex-rarity.legendary{ background:var(--legend-bg); color:var(--legend); }
  .dex-count{ position:absolute; top:4px; right:6px; font-size:9.5px; font-weight:700; background:var(--ink); color:#fff; border-radius:999px; padding:1px 6px; z-index:4;}
  .btn-equip{
    margin-top:6px; font-size:9.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    border:1.5px solid var(--bamboo); background:#fff; color:var(--bamboo-dark); cursor:pointer;
  }
  .btn-equip.active{ background:var(--bamboo); color:#fff; }
  .dex-item.equipped{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }

  /* ---------- Fuse ---------- */
  .fuse-summary{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .fuse-summary .num{ font-family:'Jua'; font-size:22px; color:var(--chili); }
  .fuse-cost{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--legend-bg); border-radius:10px; padding:8px 12px; margin-bottom:14px; }
  .fuse-cost b{ color:var(--chili); font-family:'Jua'; font-weight:400; font-size:14px; }
  .fuse-group-title{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 6px; text-transform:uppercase; letter-spacing:0.5px;}
  .fuse-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; }
  .fuse-item{ border:1.5px solid var(--line); border-radius:10px; padding:6px 4px; text-align:center; background:#fff; position:relative;}
  .fuse-item.have{ border-color:var(--bamboo); background:var(--common-bg); }
  .fuse-item img{ width:34px;height:34px;object-fit:contain; border-radius:50%; background:var(--cream); padding:3px;}
  .fuse-item .fname{ font-size:9.5px; margin-top:3px; font-weight:700; line-height:1.15; }
  .fuse-check{ position:absolute; top:2px; right:3px; color:var(--bamboo-dark); }
  .fuse-cta{ width:100%; margin-top:16px; padding:14px; font-size:15px; border-radius:14px; }

  /* ---------- Shop ---------- */
  .shop-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }

  .shop-item .btn{ width:100%; padding:6px 4px; font-size:11px; }
  .fuse-flame{ position:absolute; top:2px; left:3px; color:var(--chili); }

  /* ---------- Fuse Dex (skins) ---------- */
  .fusedex-empty{ text-align:center; padding:36px 16px; color:var(--ink-soft); font-size:13px; line-height:1.7; }
  .fusedex-empty svg{ width:34px; height:34px; color:var(--line); margin-bottom:8px; }

    border:1.5px solid var(--line); border-radius:14px; padding:12px 8px 10px; text-align:center;

  .settings-row{ display:flex; align-items:center; gap:12px; }

  .vol-wrap span{ font-size:11.5px; font-weight:700; color:var(--ink-soft); width:38px; text-align:right; }
  .code-row{ display:flex; gap:8px; }
  .code-row input[type="text"]{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px;

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,36,32,0.55); display:flex; align-items:center; justify-content:center;

  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal-card{
    background:var(--paper); border-radius:22px; padding:26px 22px 22px; max-width:340px; width:100%;

    position:relative; overflow:hidden;
  }
  .overlay.show .modal-card{ transform:scale(1); }
  .modal-close{ position:absolute; top:10px; right:10px; background:var(--common-bg); border:none; border-radius:50%; width:28px;height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .reveal-ring{ position:relative; width:130px; height:130px; margin:6px auto 10px; }
  .reveal-backdrop{ position:absolute; inset:8px; border-radius:50%; background:var(--cream); z-index:1; }
  .reveal-img{ width:130px;height:130px;object-fit:contain; padding:14px; position:relative; z-index:2; border-radius:50%; overflow:hidden;}
  .reveal-tag{ font-size:11px; font-weight:700; border-radius:999px; padding:3px 12px; display:inline-block; margin-bottom:6px;}
  .reveal-name{ font-size:20px; margin:2px 0 4px; }
  .reveal-new{ font-size:12px; color:var(--bamboo-dark); font-weight:700; }
  .modal-card-wide{ max-width:440px; }
  .reveal10-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(58px,1fr)); gap:8px; margin:6px 0 12px; }
  .reveal10-item{ border:1.5px solid var(--line); border-radius:10px; padding:6px 4px 7px; text-align:center; background:#fff; position:relative; }
  .reveal10-item.coin-bonus{ background:var(--legend-bg); border-color:var(--gold); }
  .reveal10-item.coin-bonus .reveal10-thumb-wrap{ color:var(--gold); display:flex; align-items:center; justify-content:center; }
  .reveal10-thumb-wrap{ position:relative; width:44px; height:44px; margin:0 auto 4px; }
  .reveal10-name{ font-size:9.5px; font-weight:700; line-height:1.15; margin-top:3px; }
  .reveal10-tag{ font-size:8.5px; font-weight:700; border-radius:999px; padding:1px 6px; display:inline-block; margin-top:3px; }
  .reveal10-summary{ font-size:12px; color:var(--ink-soft); font-weight:700; text-align:center; line-height:1.5; }
  .stage-clear-title{ font-size:24px; margin-bottom:4px; color:var(--chili); }

  .toast-wrap{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:700;
    box-shadow:var(--shadow); animation: toastIn .25s ease, toastOut .3s ease 1.9s forwards;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-8px);} }

  .footer-note{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:16px; opacity:0.8; }

  /* ---------- Bonus Mallangi (random coin bonus popup) ---------- */
  .bonus-mallang{
    position:fixed; width:76px; height:76px; z-index:90;
    display:none; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .bonus-mallang.show{ display:flex; animation: bonusPopIn .5s cubic-bezier(.34,1.56,.64,1); }
  .bonus-mallang.leaving{ animation: bonusPopOut .28s ease forwards; }
  .bonus-mallang-glow{
    position:absolute; inset:-10px; border-radius:50%;
    background: radial-gradient(circle, rgba(224,164,88,0.55) 0%, transparent 70%);
    animation: bonusGlowPulse 1.1s ease-in-out infinite;
  }
  .bonus-mallang img{
    position:relative; width:100%; height:100%; object-fit:contain;
    mix-blend-mode:multiply; filter:saturate(1.6) brightness(1.08);
    border-radius:50%; overflow:hidden;
    animation: bonusBob 1.3s ease-in-out infinite;
  }
  .bonus-mallang-tag{
    position:absolute; top:-10px; right:-6px; font-family:'Jua'; font-size:11px;
    color:#fff; background:var(--chili); border-radius:999px; padding:2px 8px;
    box-shadow:0 3px 8px rgba(43,36,32,0.25); animation: bonusTagWiggle 1.6s ease-in-out infinite;
  }
  @keyframes bonusPopIn{
    0%{ transform:scale(0.2); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes bonusPopOut{
    0%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(0.2); opacity:0; }
  }
  @keyframes bonusGlowPulse{
    0%,100%{ opacity:0.55; transform:scale(0.94); }
    50%{ opacity:0.95; transform:scale(1.08); }
  }
  @keyframes bonusBob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-7px) rotate(2deg); }
  }
  @keyframes bonusTagWiggle{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(6deg); }
  }

  @media (max-width:420px){
    .brand h1{ font-size:18px; }
    .stat-pill{ font-size:12px; padding:5px 10px 5px 7px; }
    .basket{ width:190px; height:170px; }
    .dumpling-wrap img{ width:140px; height:140px; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">

<script>
/* ================= 모바일: 스크롤/확대 방지 ================= */
/* 핀치줌 제스처 차단 (iOS Safari 전용 이벤트) */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('gestureend', function(e){ e.preventDefault(); });
/* 두 손가락 이상으로 화면을 움직이는 핀치줌 동작 차단 */
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1){ e.preventDefault(); }
}, {passive:false});
/* 더블탭 확대 차단은 CSS touch-action:manipulation으로 처리 (버튼 요소들에 적용)
   -> touchend에서 preventDefault로 막는 방식은 빠른 연타 시 click 이벤트 자체를
      씹어버려서(연타가 안 먹는 문제) 제거함 */

/* ================= ICONS ================= */
function svg(inner, size){ size=size||18; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>'; }
const ICONS = {
  coin: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/>'),
  ticket: svg('<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><line x1="10" y1="6" x2="10" y2="18" stroke-dasharray="2 3"/>'),
  gacha: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a9 15 0 0 1 0 18"/>'),
  book: svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A1.5 1.5 0 0 1 18.5 20H6.5A2.5 2.5 0 0 0 4 22.5V5.5Z"/><path d="M4 19a2.5 2.5 0 0 1 2.5-2.5H20"/>'),
  flame: svg('<path d="M12 22c4.4 0 7-2.6 7-6.6 0-3.2-2-5-3.4-7.3-.5.9-1.1 1.7-1.9 2.3.2-2.4-.5-5-3.2-7.4-.2 2.6-1.3 4.4-3 6C6 10.6 5 12.6 5 15.4 5 19.4 7.6 22 12 22Z"/>'),
  store: svg('<path d="M3 9 4.5 4h15L21 9"/><path d="M3 9v11h18V9"/><path d="M9 20v-6h6v6"/><path d="M3 9h18"/>'),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  x: svg('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),

  '황금사과':{hue:46, sat:1.5, bri:1.15}, '천상의 복숭아':{hue:340, sat:1.1, bri:1.1},
  '무지개멜론':{hue:320, rainbow:true}
};
function buildTypes(def){
  /* 이 두 단계는 이름=색 이름이라 정확한 색상 매핑(COLOR_HUE_MAP)을 쓰고,
     과일 단계는 FRUIT_HUE_MAP을 씀. 나머지 단계는 기존처럼 균등 분할 hue를 그대로 씀 */
  const nkey = def.namedKey || def.key;
  const namedMap = (nkey==='color' || nkey==='cheese-color' || nkey==='butter-color') ? COLOR_HUE_MAP
    : nkey==='fruit' ? FRUIT_HUE_MAP : null;
  function makeOne(name, i, rarity, hueFallback){
    const named = namedMap ? namedMap[name] : null;
    const base = {
      id: def.key+'-'+rarity[0]+i, name, rarity, stage:def.key,
      hue: named ? named.hue : hueFallback
    };
    if(named){
      base.colorize = true;
      if(named.sat!=null) base.colorSat = named.sat;
      if(named.bri!=null) base.colorBri = named.bri;
      if(named.rainbow) base.rainbowEffect = true;
    }
    return base;
  }
  const common = def.common.map((name,i)=> makeOne(name, i, 'common', Math.round(i*(360/def.common.length))));
  const rare = def.rare.map((name,i)=> makeOne(name, i, 'rare', Math.round(18+i*(360/def.rare.length))));
  const legendary = def.legendary.map((name,i)=> makeOne(name, i, 'legendary', Math.round(30+i*(360/def.legendary.length))));
  return common.concat(rare, legendary);
}

/* title 앞의 "N단계 ·"는 배열 위치(i)로 자동 계산해서 붙임 → 중간에 단계를 추가/삭제해도
   번호 표기가 절대 어긋나지 않음. img/mascot은 각 단계의 기본 말랑이 이미지/이름(예: 만두, 치즈) */
const STAGES = STAGE_DEFS.map((def,i)=>({
  key:def.key, title:(i+1)+'단계 · '+def.title, desc:def.desc,
  theme:def.theme, filter:def.filter,
  img: def.img || DUMPLING_IMG, mascot: def.mascot || '만두',
  types: buildTypes(def),
  shop:{ commonPrice:0, rarePrices:{}, legendaryPrices:{}, nextRefresh:0 },
  fuseReq:null
}));

const TYPE_MAP = new Map();
STAGES.forEach(s=> s.types.forEach(t=> TYPE_MAP.set(t.id,t)));

/* 임의의 도감 만두(type)나 퓨즈 스킨(skin)을 받아 그게 속한 단계(STAGES 엔트리)를 찾아줌.
   type은 .stage(키)로, skin은 .stageIndex(숫자)로 단계를 갖고 있어서 둘 다 대응 */
function stageOf(item){
  if(!item) return null;
  if(item.stage) return STAGES.find(s=>s.key===item.stage) || null;
  if(typeof item.stageIndex==='number') return STAGES[item.stageIndex] || null;
  return null;
}
function imgFor(item){ if(item && item.customImg) return item.customImg; const s = stageOf(item); return s ? s.img : DUMPLING_IMG; }
function mascotFor(item){ if(item && item.customMascot) return item.customMascot; const s = stageOf(item); return s ? s.mascot : '만두'; }

/* 퓨즈 도감(스킨): 각 단계를 완성하면 얻는 전용 말랑이 스킨. 외형만 바뀌고 수익은 장착된 도감 만두를 그대로 따름.
   규칙: 2n단계(짝수 번째 단계, 인덱스 기준 홀수 i)는 앞으로 항상 "은하계" 테마로 고정(보라색·하늘색이
   겹쳐진 링 + 별가루 + 화려한 이펙트). 1~3단계(2n-1, 인덱스 짝수 i)는 기존처럼 무지개 테마를 씀.
   이 규칙은 이후 무한히 이어지는 단계(퓨즈 계속)에도 동일하게 적용됨 */
const FUSE_CUSTOM_NAME_POOL = ['모찌','폭신','토실','몰랑','포동','몽실','새콤','달콤','상큼','말랑'];
function randomFuseCustomName(){ return FUSE_CUSTOM_NAME_POOL[Math.floor(Math.random()*FUSE_CUSTOM_NAME_POOL.length)]; }
function buildFuseSkin(i, s){
  let name, style = null;
  if(i===4){
    name = '무지개 버터'; style = 'rainbow'; // 5단계(색 버터) 퓨즈 완성 전용 스킨
  } else if(i%2===1){
    name = '은하계 x '+s.mascot; style = 'galaxy'; // 2n단계: 항상 은하계 고정
  } else if(i<4){
    name = '무지개 x '+s.mascot; style = 'rainbow'; // 초반 2n-1단계: 무지개
  } else {
    name = s.title.split('·').length>1 ? s.title.split('·')[1].trim()+' 퓨즈' : s.title+' 퓨즈';
  }
  return {
    id: 'fuseskin-'+s.key,
    name,
    desc: s.title+' 완성 기념 스킨',
    rarity: 'legendary',
    hue: Math.round(i*(360/12)),
    stageIndex: i,
    style
  };
}
const FUSE_SKINS = STAGES.map((s,i)=> buildFuseSkin(i,s));
/* 원래 정의된 12단계를 모두 퓨즈하고 나면 게임을 끝내는 대신, 같은 단계 목록을 다음 회차로
   재활용해서 무한히 이어가도록 함. buildTypes에는 namedKey로 원래 단계 key를 전달해
   색깔/과일 단계의 이름-색상 매핑이 회차와 상관없이 항상 정확하게 유지되도록 함 */
function ensureStageBuilt(idx){
  while(STAGES.length<=idx){
    const newIndex = STAGES.length;
    const baseDef = STAGE_DEFS[newIndex % STAGE_DEFS.length];
    const loop = Math.floor(newIndex / STAGE_DEFS.length); // 0 = 원래 회차
    const def = loop===0 ? baseDef : Object.assign({}, baseDef, {
      key: baseDef.key+'-loop'+loop,
      namedKey: baseDef.key,
      title: baseDef.title+' '+(loop+1)+'회차'
    });
    const stageObj = {
      key: def.key,
      title: (newIndex+1)+'단계 · '+def.title,
      desc: def.desc,
      theme: def.theme, filter: def.filter,
      img: def.img || DUMPLING_IMG, mascot: def.mascot || '만두',
      types: buildTypes(def),
      shop:{ commonPrice:0, rarePrices:{}, legendaryPrices:{}, nextRefresh:0 },
      fuseReq:null
    };
    STAGES.push(stageObj);
    stageObj.types.forEach(t=> TYPE_MAP.set(t.id, t));
    FUSE_SKINS.push(buildFuseSkin(newIndex, stageObj));
  }
}
function getEquippedSkin(){
  if(!state.equippedSkinId) return null;
  return FUSE_SKINS.find(f=>f.id===state.equippedSkinId) || (state.generalSkins||[]).find(g=>g.id===state.equippedSkinId) || null;
}

/* ================= CLICK BALANCE ================= */
/* 밸런스 규칙: "다음 단계의 일반 만두 수익은 반드시 이전 단계의 전설 만두 수익보다 높아야 한다."
   즉 일반→레어→전설로 갈수록 오르고(레어 3배, 전설 7배), 단계가 하나 넘어갈 때도
   또 한 번 확실히 올라야 함. 이걸 항상 만족시키려면 "단계 성장 배율(CLICK_STAGE_GROWTH)"이
   "등급 배율 중 가장 큰 값(legendary)"보다 커야 함 (9 > 7이므로 항상 성립).
   아래 stageEconomyFactor()가 이 값들을 그대로 참조해서 상점가/뽑기가도 자동으로 같이 맞춰짐 */
const RARITY_CLICK_MULT = {common:1, rare:3, legendary:7};
/* 단계가 늘어나도 별도 배열을 추가할 필요 없이 공식으로 자동 확장되는 클릭 수익 */
const CLICK_STAGE_GROWTH = 9;
function stageBaseClick(idx){ return Math.max(1, Math.round(1 * Math.pow(CLICK_STAGE_GROWTH, idx))); }

function stageIdxOf(type){ return STAGES.findIndex(s=>s.key===type.stage); }
function getEquippedType(){
  if(state.equippedId && state.dex.has(state.equippedId)) return TYPE_MAP.get(state.equippedId);
  return null;
}
function baseClickValue(){
  const eq = getEquippedType();
  if(!eq) return stageBaseClick(0);
  return Math.round(stageBaseClick(stageIdxOf(eq)) * RARITY_CLICK_MULT[eq.rarity]);
}

/* ================= FILTER / VISUAL HELPERS ================= */
/* 단계별 필터는 이제 STAGE_DEFS에 함께 정의되어 있어(각 테마의 질감을 표현),
   여기서는 그 값을 안전하게 읽어오기만 함. 정의된 단계를 넘어서면 마지막 느낌을
   재사용해서 이후 단계가 추가돼도 깨지지 않음 */
function stageFilterExtra(idx){
  if(idx<0) idx = 0;
  if(idx>=STAGES.length) idx = STAGES.length-1;
  return STAGES[idx].filter || '';
}
/* 현재 진행 단계의 테마 색상(2톤 그라디언트 + 배경톤)을 CSS 변수로 반영해서
   찜통/기둥/스테이지바가 단계마다 실제로 다른 색과 분위기를 갖도록 함 */
function applyStageTheme(idx){
  if(idx<0) idx = 0;
  if(idx>=STAGES.length) idx = STAGES.length-1;
  const t = STAGES[idx].theme;
  if(!t) return;
  const root = document.documentElement.style;
  root.setProperty('--stage-a', t.a);
  root.setProperty('--stage-b', t.b);
  root.setProperty('--stage-bg', t.bg);
}
function filterFor(type){
  if(type && type.customFilter) return type.customFilter;
  let sat = type.rarity==='common' ? 2.1 : type.rarity==='rare' ? 2.7 : 3.2;
  let bri = type.rarity==='common' ? 1.02 : type.rarity==='rare' ? 1.08 : 1.14;
  let con = type.rarity==='common' ? 1.02 : 1.1;
  const idx = stageIdxOf(type);
  sat = sat * (1 + idx*0.04); // 단계가 오를수록 색이 조금씩 더 진해짐
  if(type.colorize){
    /* 원본 사진(만두/치즈)이 어떤 색이든 상관없이 이름이 가리키는 색이 실제로 보이도록,
       먼저 grayscale+sepia로 원본 색을 지우고 그 기준(세피아 색상각 ~30deg)에서
       원하는 색상각까지 회전시킴. 이렇게 해야 "빨강" 만두가 진짜 붉게, "파랑" 만두가
       진짜 푸르게 보임(기존에는 원본 사진 색 위에 단순 회전만 해서 이름과 실제 색이 어긋났음) */
    sat = sat * (type.colorSat!=null ? type.colorSat : 1);
    bri = bri * (type.colorBri!=null ? type.colorBri : 1);
    const rot = type.hue - 30;
    return 'grayscale(1) sepia(1) hue-rotate('+rot+'deg) saturate('+sat.toFixed(2)+') brightness('+bri.toFixed(2)+') contrast('+con+')';
  }
  return 'hue-rotate('+type.hue+'deg) saturate('+sat.toFixed(2)+') brightness('+bri+') contrast('+con+')'+stageFilterExtra(idx);
}
/* 먹색/흑진주는 다른 만두들과 달리 항상 바깥 테두리가 사각으로 각져있음(도감/퓨즈 도감 등
   개수로 보여지는 모든 곳에 공통 적용되도록 thumbHtml 한 곳에서 처리) */
function isSquareShape(type){ return !!(type && (type.name==='먹색' || type.name==='흑진주')); }
function ringClassFor(type){
  let cls = type.rarity==='rare' ? 'ring rare' : type.rarity==='legendary' ? 'ring legendary' : '';
  if(isSquareShape(type)) cls = (cls ? cls : 'ring') + ' ring-square';
  return cls;
}
function thumbHtml(type, opts){
  opts = opts||{};
  const size = opts.size||56;
  const locked = opts.locked;
  const bg = opts.bg || 'var(--cream)';
  const filter = locked ? 'grayscale(1) brightness(0.5)' : filterFor(type);
  const inner = Math.round(size*0.82);
  const extraImgClass = locked ? '' : skinExtraImgClass(type);
  const fruitBg = locked ? null : fruitOverlayBg(type);
  const fruitOverlay = fruitBg ? '<span class="fruit-overlay" style="background:'+fruitBg+';"></span>' : '';
  const shapeRadius = (!locked && isSquareShape(type)) ? '10px' : '50%';
  return '<span class="thumb-circle" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:'+size+'px;height:'+size+'px;border-radius:'+shapeRadius+';background:'+bg+';overflow:hidden;">'+
    '<img src="'+imgFor(type)+'" class="blend-photo'+extraImgClass+'" style="width:'+inner+'px;height:'+inner+'px;object-fit:contain;filter:'+filter+'" alt="'+(locked?'???':type.name)+'">'+
    fruitOverlay+
  '</span>';
}

/* ================= AUDIO ================= */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended'){ actx.resume(); } }
/* 설정 탭의 음소거/볼륨을 모든 효과음에 공통 반영. exponentialRampToValueAtTime은
   0을 목표값으로 쓸 수 없어서 무음이어도 아주 작은 값(0.0001)을 사용함 */
function soundGain(base){
  if(state.settings && state.settings.muted) return 0.0001;
  const vol = (state.settings && state.settings.volume!=null) ? state.settings.volume : 1;
  return Math.max(0.0001, base*vol);
}
function playPop(pitch, mascot){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  if(mascot==='치즈'){ playCheeseSquish(pitch); return; }
  if(mascot==='버터'){ playButterSquish(pitch); return; }
  if(mascot==='키캡'){ playKeycapClack(pitch); return; }
  const t0=actx.currentTime;
  const osc=actx.createOscillator(); const gain=actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(240*pitch, t0);
  osc.frequency.exponentialRampToValueAtTime(480*pitch, t0+0.08);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(soundGain(0.28), t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.22);
}
/* 치즈 말랑이 전용 클릭음: 버터의 매끄러운 사인파 멜팅음과 겹치지 않도록, 노이즈를
   대역통과 필터로 걸러 만든 '샤아악' 쉬익 소리(고음→저음으로 쓸려 내려가는 스침음)에
   '사르르' 늘어나는 낮은 글리산도 톤을 겹쳐서, 치즈가 쭉 늘어나며 갈라지는 질감을 냄 */
function playButterSquish(pitch){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  const t0=actx.currentTime;
  const dur = 0.4;
  const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(3400*pitch, t0);
  bp.frequency.exponentialRampToValueAtTime(850*pitch, t0+dur);
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, t0);
  noiseGain.gain.exponentialRampToValueAtTime(soundGain(0.24), t0+0.05);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  noise.connect(bp).connect(noiseGain).connect(actx.destination);
  noise.start(t0); noise.stop(t0+dur);

  const osc = actx.createOscillator();
  const oscGain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180*pitch, t0);
  osc.frequency.linearRampToValueAtTime(105*pitch, t0+0.28);
  oscGain.gain.setValueAtTime(0.0001, t0);
  oscGain.gain.exponentialRampToValueAtTime(soundGain(0.18), t0+0.04);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
  osc.connect(oscGain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.34);
}
/* 버터 말랑이 전용 클릭음: 치즈의 출렁이는 물결과 달리, 사인파 + 로우패스 필터가
   부드럽게 하강하며 '사르르 녹는' 느낌을 냄. 통통 튀지 않고 한 번에 매끄럽게 미끄러짐 */
function playCheeseSquish(pitch){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  const t0=actx.currentTime;
  const osc=actx.createOscillator();
  const lp=actx.createBiquadFilter();
  const gain=actx.createGain();
  osc.type='sine';
  lp.type='lowpass';
  lp.frequency.setValueAtTime(2400*pitch, t0);
  lp.frequency.exponentialRampToValueAtTime(450*pitch, t0+0.3);
  osc.frequency.setValueAtTime(320*pitch, t0);
  osc.frequency.exponentialRampToValueAtTime(170*pitch, t0+0.24);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(soundGain(0.32), t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.36);
  osc.connect(lp).connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.38);
}
/* 키캡 스킨 전용 클릭음: 다른 스킨들의 부드러운 '말랑' 소리와 달리, 기계식 키보드
   스위치를 연달아 두드리는 '타다닥' 3연타 타건음을 냄. 각 타건은 짧은 대역통과
   노이즈(딸깍 성분)와 저역 트라이앵글 톤(몸통 울림)을 겹쳐서 만들고, 타건마다
   시작 시각을 살짝 어긋나게 배치해 실제 연타처럼 들리게 함 */
function playKeycapClack(pitch){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  const t0 = actx.currentTime;
  const hits = [0, 0.05, 0.095]; // 타 - 다 - 닥
  hits.forEach((offset, idx)=>{
    const t = t0 + offset;
    const dur = 0.05;
    const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = actx.createBufferSource();
    noise.buffer = buffer;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 2.4;
    bp.frequency.setValueAtTime((2700 + idx*260)*pitch, t);
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(soundGain(idx===0 ? 0.32 : 0.24), t+0.004);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    noise.connect(bp).connect(ng).connect(actx.destination);
    noise.start(t); noise.stop(t+dur);

    const osc = actx.createOscillator();
    const og = actx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160*pitch, t);
    osc.frequency.exponentialRampToValueAtTime(95*pitch, t+0.05);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(soundGain(0.14), t+0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
    osc.connect(og).connect(actx.destination);
    osc.start(t); osc.stop(t+0.07);
  });
}
function playChime(rarity){
  ensureAudio(); if(!actx) return;
  const notesMap = {common:[523.25,659.25], rare:[523.25,659.25,783.99,1046.5], legendary:[440,554.37,659.25,880,1108.7,1318.5]};
  const notes = notesMap[rarity]||notesMap.common;
  notes.forEach((f,i)=>{
    const t0=actx.currentTime + i*0.1;
    const osc=actx.createOscillator(); const gain=actx.createGain();
    osc.type='triangle'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(soundGain(0.22),t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0); osc.stop(t0+0.45);
  });
}

/* ================= TOAST ================= */
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 2300);

/* ================= STAGE RUNTIME INIT ================= */
function sampleIds(types, min, max){
  const n = randInt(min, Math.min(max, types.length));
  const shuffled = types.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0,n).map(t=>t.id);
}
function refreshFuseReq(stage){
  const commons = stage.types.filter(t=>t.rarity==='common');
  const rares = stage.types.filter(t=>t.rarity==='rare');
  const legends = stage.types.filter(t=>t.rarity==='legendary');
  stage.fuseReq = {
    commons: commons.map(t=>t.id),
    rares: sampleIds(rares,4,7),
    legendaries: sampleIds(legends,2,3)
  };
  stage.fuseNextRefresh = Date.now()+60000;
}
function initStageRuntime(idx){
  const stage = STAGES[idx];
  refreshFuseReq(stage);
  stage.shop.commonPrice = Math.round(25 * stageEconomyFactor(idx));
  refreshShopPrices(stage);
}
function refreshShopPrices(stage){
  const idx = STAGES.indexOf(stage);
  const scale = stageEconomyFactor(idx);
  stage.shop.rarePrices = {};
  stage.shop.legendaryPrices = {};
  stage.types.filter(t=>t.rarity==='rare').forEach(t=>{
    stage.shop.rarePrices[t.id] = randInt(Math.round(150*scale), Math.round(300*scale));
  });
  stage.types.filter(t=>t.rarity==='legendary').forEach(t=>{
    stage.shop.legendaryPrices[t.id] = randInt(Math.round(900*scale), Math.round(1600*scale));
  });
  stage.shop.nextRefresh = Date.now()+60000;
}
function getPrice(type){
  const stage = STAGES.find(s=>s.key===type.stage);
  if(type.rarity==='common') return stage.shop.commonPrice;
  if(type.rarity==='rare') return stage.shop.rarePrices[type.id];
  return stage.shop.legendaryPrices[type.id];
}

/* ================= CORE ACTIONS ================= */
/* 다음 단계로 넘어갈 때는 '그 전 단계의 전설 만두'를 장착해서 버는 수익이
   플레이어의 실제 수입이라고 가정하고, 그 수입 기준으로 가격을 잡음.
   (1단계 초반은 아직 전설 만두가 없으므로 기본 클릭값 1을 기준으로 함)
   나중에 단계를 몇 개 더 추가해도 이 공식이 자동으로 대응함 */
function stageEconomyFactor(idx){
  if(idx<=0) return stageBaseClick(0); // 1단계 초반: 기본 클릭값 기준
  return stageBaseClick(idx-1) * RARITY_CLICK_MULT.legendary; // 그 이후: 전 단계 전설 만두 클릭값 기준
}

/* 뽑기 탭에서는 카테고리(단계)를 따로 선택할 수 있으므로, 뽑기 비용/확률은
   진행 단계(state.stageIndex)가 아니라 사용자가 선택한 뽑기 단계(state.gachaStageView)를
   기준으로 계산함. 단, 퓨즈 비용은 항상 진행 중인 단계 기준 그대로 유지 */
function gachaStage(){ return STAGES[state.gachaStageView]; }
function normalGachaCost(){ return Math.round(40 * stageEconomyFactor(state.gachaStageView)); }
function rareGachaCost(){ return Math.round(150 * stageEconomyFactor(state.gachaStageView)); }
function legendaryGachaCost(){ return Math.round(650 * stageEconomyFactor(state.gachaStageView)); }
function fuseCoinCost(){ return Math.round(2200 * stageEconomyFactor(state.stageIndex)); }
/* 전설 뽑기 실패(대체 코인) 보상도 전설 뽑기 비용에 비례하게 만들어서
   단계가 올라가도 보상이 상대적으로 초라해지지 않도록 함 */
function legendaryCoinBonus(){ return Math.round(legendaryGachaCost()*0.55); }
function normalGacha10Cost(){ return normalGachaCost()*10; }
function rareGacha10Cost(){ return rareGachaCost()*10; }
function legendaryGacha10Cost(){ return legendaryGachaCost()*10; }

function rollRarity(table){
  const r = Math.random()*100; let acc=0;
  for(const k in table){ acc+=table[k]; if(r<acc) return k; }
  const keys = Object.keys(table); return keys[keys.length-1];
}
/* 마일리지는 이제 카테고리(단계)별로 따로 쌓임. 새 단계가 해금되면 자동으로 0부터 시작함 */
function getMileage(stageKey){
  if(!state.mileage[stageKey]) state.mileage[stageKey] = {common:0, rare:0, legendary:0};
  return state.mileage[stageKey];
}
function addMileage(stageKey, rarity, amt){
  const m = getMileage(stageKey);
  m[rarity] = (m[rarity]||0) + amt;
}
/* 중복 만두가 나오면 등급별 마일리지로 적립됨(카테고리별 독립).
   단, 이미 퓨즈를 완료한 '지난 단계'의 만두는 앞으로 상점 가격 기준이 될 예정이라
   중복이어도 도감 보유 개수가 함께 계속 쌓임. 현재 해금 최상위 단계는 지금처럼
   마일리지만 쌓이고 보유 개수는 늘지 않음(1개 유지) */
function grantType(type){
  const owned = state.inventory[type.id]||0;
  const isNewDiscovery = !state.dex.has(type.id);
  state.dex.add(type.id);
  const isPastStage = stageIdxOf(type) < state.stageIndex;
  if(owned<=0){
    state.inventory[type.id] = 1;
    return { isNew:isNewDiscovery, restocked: !isNewDiscovery, mileage:0 };
  }
  addMileage(type.stage, type.rarity, 1);
  if(isPastStage) state.inventory[type.id] = owned+1;
  return { isNew:false, restocked:false, mileage:1, stacked:isPastStage };
}
/* ---- 뽑기 1회분 로직: 단일 뽑기와 10연 뽑기가 동일하게 재사용 ---- */
function rollNormalOnce(){
  const stage = gachaStage();
  const rarity = rollRarity({common:85, rare:15});
  const pool = stage.types.filter(t=>t.rarity===rarity);
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}
function rollRareOnce(){
  const stage = gachaStage();
  const rarity = rollRarity({rare:85, legendary:15});
  const pool = stage.types.filter(t=>t.rarity===rarity);
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}
function rollLegendaryOnce(){
  const stage = gachaStage();
  if(Math.random() < 0.5){
    const amount = legendaryCoinBonus();
    state.coins += amount;
    return { coinsOnly:true, amount };
  }
  const pool = stage.types.filter(t=>t.rarity==='legendary');
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}

function doNormalGacha(){
  const cost = normalGachaCost();
  if(state.coins < cost){ toast('코인이 부족합니다'); return; }
  state.coins -= cost;
  const {type:picked, result} = rollNormalOnce();
  playChime(picked.rarity);
  showReveal(picked, result);
  renderAll();
}
function doRareGacha(){
  const cost = rareGachaCost();
  if(state.ticketsRare < 1){ toast('레어 뽑기권이 없습니다'); return; }
  if(state.coins < cost){ toast('코인이 부족합니다'); return; }
  state.ticketsRare -= 1;
  state.coins -= cost;
  const {type:picked, result} = rollRareOnce();
  playChime(picked.rarity);
  showReveal(picked, result);
  renderAll();
}
function doLegendaryGacha(){
  const cost = legendaryGachaCost();
  if(state.ticketsLegendary < 1){ toast('전설 뽑기권이 없습니다'); return; }
  if(state.coins < cost){ toast('코인이 부족합니다'); return; }
  state.ticketsLegendary -= 1;
  state.coins -= cost;
  const roll = rollLegendaryOnce();
  if(roll.coinsOnly){
    playChime('legendary');
    toast('전설 만두 대신 '+fmt(roll.amount)+' 코인을 획득했습니다!');
    renderAll();
    return;
  }
  playChime('legendary');
  showReveal(roll.type, roll.result);
  renderAll();
}

/* ---- 10연 뽑기: 가격과 소모량을 10배로 한 번에 처리하고 결과를 모아서 보여줌 ---- */
function finishGacha10(rolls){
  const order = {common:0, rare:1, legendary:2};
  let best = 'common';
  rolls.forEach(r=>{ if(r.type && order[r.type.rarity]>order[best]) best = r.type.rarity; });
  playChime(best);
  showReveal10(rolls);
  renderAll();
}
function doNormalGacha10(){
  const cost = normalGacha10Cost();
  if(state.coins < cost){ toast('코인이 부족합니다 (10연 '+fmt(cost)+')'); return; }
  state.coins -= cost;
  const rolls = [];
  for(let i=0;i<10;i++) rolls.push(rollNormalOnce());
  finishGacha10(rolls);
}
function doRareGacha10(){
  const cost = rareGacha10Cost();
  if(state.ticketsRare < 10){ toast('레어 뽑기권이 부족합니다 (10장 필요)'); return; }
  if(state.coins < cost){ toast('코인이 부족합니다 (10연 '+fmt(cost)+')'); return; }
  state.ticketsRare -= 10;
  state.coins -= cost;
  const rolls = [];
  for(let i=0;i<10;i++) rolls.push(rollRareOnce());
  finishGacha10(rolls);
}
function doLegendaryGacha10(){
  const cost = legendaryGacha10Cost();
  if(state.ticketsLegendary < 10){ toast('전설 뽑기권이 부족합니다 (10장 필요)'); return; }
  if(state.coins < cost){ toast('코인이 부족합니다 (10연 '+fmt(cost)+')'); return; }
  state.ticketsLegendary -= 10;
  state.coins -= cost;
  const rolls = [];
  for(let i=0;i<10;i++) rolls.push(rollLegendaryOnce());
  finishGacha10(rolls);
}
function commonTotal(stage){
  return stage.types.filter(t=>t.rarity==='common').reduce((s,t)=> s+(state.inventory[t.id]||0), 0);
}
/* ---- 뽑기권 제작: 현재 뽑기 탭에서 선택 중인 카테고리의 마일리지를 소비 ---- */
const RARE_TICKET_COST = 10;   // 일반 마일리지
const LEGEND_TICKET_COST = 5;  // 레어 마일리지
/* 전설 마일리지는 그동안 쌓이기만 하고 쓸 곳이 없었음. 이제 전설 마일리지 1개를
   레어 마일리지 3개로 전환할 수 있음 */
const LEGEND_MILEAGE_FILL_AMOUNT = 3;
function fillRareFromLegendary(){
  const m = getMileage(gachaStage().key);
  if(m.legendary < 1){ toast('전설 마일리지가 부족합니다'); return; }
  m.legendary -= 1;
  m.rare += LEGEND_MILEAGE_FILL_AMOUNT;
  playChime('legendary');
  toast('전설 마일리지로 레어 마일리지 +'+LEGEND_MILEAGE_FILL_AMOUNT);
  renderAll();
}
function craftRareTicket(){
  const m = getMileage(gachaStage().key);
  if(m.common < RARE_TICKET_COST){ toast('일반 마일리지가 부족합니다'); return; }
  m.common -= RARE_TICKET_COST;
  state.ticketsRare += 1;
  playChime('rare');
  toast('레어 뽑기권을 획득했습니다');
  renderAll();
}
function craftLegendaryTicket(){
  const m = getMileage(gachaStage().key);
  if(m.rare < LEGEND_TICKET_COST){ toast('레어 마일리지가 부족합니다'); return; }
  m.rare -= LEGEND_TICKET_COST;
  state.ticketsLegendary += 1;
  playChime('legendary');
  toast('전설 뽑기권을 획득했습니다');
  renderAll();
}
function buyItem(typeId){
  const type = TYPE_MAP.get(typeId);
  const price = getPrice(type);
  if(state.coins < price){ toast('코인이 부족합니다'); return; }
  state.coins -= price;
  state.inventory[typeId] = (state.inventory[typeId]||0)+1;
  state.dex.add(typeId);
  playPop(1.15, mascotFor(type));
  toast(type.name+' '+mascotFor(type)+'를 구매했습니다');
  renderAll();
}
function attemptFuse(){
  const stage = currentStage();
  const req = stage.fuseReq;
  const all = req.commons.concat(req.rares, req.legendaries);
  const missing = all.filter(id => (state.inventory[id]||0) < 1);
  if(missing.length>0){ toast('재료가 '+missing.length+'개 부족합니다'); return; }
  const cost = fuseCoinCost();
  if(state.coins < cost){ toast('코인이 부족합니다 (필요 '+fmt(cost)+')'); return; }
  state.coins -= cost;
  all.forEach(id => state.inventory[id] -= 1);
  playChime('legendary');
  advanceStage();
}
function advanceStage(){
  const finished = currentStage();
  const nextIdx = state.stageIndex+1;
  ensureStageBuilt(nextIdx); /* 앞으로 퓨즈는 끝나지 않고 계속 이어짐 */
  initStageRuntime(nextIdx);
  showStageClear(finished, STAGES[nextIdx]);
  state.stageIndex = nextIdx;
  state.activeTab = 'gacha';
  state.dexStageView = nextIdx;
  /* 뽑기 카테고리(gachaStageView)는 더 이상 자동으로 다음 단계로 넘기지 않음.
     예전에는 여기서 강제로 다음 단계 카테고리로 바꿔버려서, 보유 중이던 레어/전설
     뽑기권이 플레이어 의도와 상관없이 새 단계 카테고리에 묶여 소모되는 문제가 있었음.
     이제는 플레이어가 보고 있던 카테고리를 그대로 유지하고, 원하면 햄버거 메뉴에서
     직접 새 단계 카테고리를 선택하도록 함 */
  renderAll();
}

/* ================= RENDER ================= */
function renderHeader(){
  document.getElementById('coinCount').textContent = fmt(state.coins);

function shopCountdownText(stage){
  const remain = Math.max(0, stage.shop.nextRefresh - Date.now());
  const s = Math.floor(remain/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return mm+':'+ss;
}
function fuseCountdownText(stage){
  const remain = Math.max(0, stage.fuseNextRefresh - Date.now());
  const s = Math.floor(remain/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return mm+':'+ss;
}

/* ================= SAVE CODE SYSTEM ================= */
/* 한글 등 유니코드가 섞여도 안전하게 base64로 인코딩/디코딩하기 위한 헬퍼 */
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }
const SAVE_CODE_PREFIX = 'MDSAVE1:';
function exportSaveCode(){
  const payload = {
    v:1,
    coins: state.coins,
    ticketsRare: state.ticketsRare,
    ticketsLegendary: state.ticketsLegendary,
    mileage: state.mileage,
    stageIndex: state.stageIndex,
    inventory: state.inventory,
    dex: Array.from(state.dex),
    equippedId: state.equippedId,
    equippedSkinId: state.equippedSkinId,
    generalSkins: state.generalSkins||[],
    redeemedCodes: Array.from(state.redeemedCodes||[]),
    settings: state.settings
  };
  return SAVE_CODE_PREFIX + b64EncodeUnicode(JSON.stringify(payload));
}
function importSaveCode(code){
  try{
    const raw = code.slice(SAVE_CODE_PREFIX.length);
    const payload = JSON.parse(b64DecodeUnicode(raw));
    if(!payload || payload.v!==1) return false;
    state.coins = payload.coins||0;
    state.ticketsRare = payload.ticketsRare||0;
    state.ticketsLegendary = payload.ticketsLegendary||0;
    state.mileage = payload.mileage||{};
    state.stageIndex = payload.stageIndex||0;
    state.inventory = payload.inventory||{};
    state.dex = new Set(payload.dex||[]);
    state.equippedId = payload.equippedId||null;
    state.equippedSkinId = payload.equippedSkinId||null;
    state.generalSkins = payload.generalSkins||[];
    state.redeemedCodes = new Set(payload.redeemedCodes||[]);
    if(payload.settings) state.settings = Object.assign({muted:false, volume:0.85}, payload.settings);
    state.gachaStageView = state.stageIndex;
    state.dexStageView = state.stageIndex;
    return true;
  }catch(e){ return false; }
}
/* 코드 입력란은 하나로 이벤트 코드('mandu')와 세이브 코드(MDSAVE1:...) 둘 다 받음 */
function submitCode(){
  const inputEl = document.getElementById('codeInput');
  if(!inputEl) return;
  const raw = (inputEl.value||'').trim();
  if(!raw){ toast('코드를 입력해주세요'); return; }
  if(raw.startsWith(SAVE_CODE_PREFIX)){
    const ok = importSaveCode(raw);
    if(ok){
      toast('세이브를 불러왔습니다');
      inputEl.value='';
      initStageRuntime(state.stageIndex);
      tintHero();
      renderAll();
    } else {
      toast('세이브 코드를 불러오지 못했습니다');
    }
    return;
  }
  if(raw.toLowerCase()==='mandu'){
    if(!state.redeemedCodes) state.redeemedCodes = new Set();
    if(state.redeemedCodes.has('mandu')){ toast('이미 사용한 코드입니다'); return; }
    state.redeemedCodes.add('mandu');
    state.coins += 400;
    playChime('rare');
    toast('코드 사용 완료! +400 코인');
    inputEl.value='';
    renderAll();
    return;
  }
  if(raw.toLowerCase()==='keycap'){
    if(!state.redeemedCodes) state.redeemedCodes = new Set();
    if(state.redeemedCodes.has('keycap')){ toast('이미 사용한 코드입니다'); return; }
    createKeycapSkin();
    inputEl.value='';
    return;
  }
  if(raw.toLowerCase()==='unvulmandu'){
    if(!state.redeemedCodes) state.redeemedCodes = new Set();
    inputEl.value='';
    const fileInput = document.getElementById('hiddenSkinFileInput');
    if(fileInput){
      toast('내 사진(img.png)을 선택해주세요');
      fileInput.click();
    } else {
      toast('이 기기에서는 파일을 선택할 수 없어요');
    }
    return;
  }
  toast('유효하지 않은 코드입니다');
}
/* unvulmandu 코드: 로컬 이미지를 골라 만두 필터를 입힌 '일반 스킨'을 만듦(퓨즈 완성 스킨과
   달리 퓨즈 도감 & 스킨 탭의 '일반 스킨' 쪽에 들어감) */
const UNVULMANDU_FILTER = 'sepia(0.25) saturate(1.35) contrast(1.08) brightness(1.05)';
function createUnvulmanduSkin(dataUrl){
  if(!state.redeemedCodes) state.redeemedCodes = new Set();
  state.redeemedCodes.add('unvulmandu');
  const skin = {
    id:'genskin-unvulmandu',
    name:'만두 말랑이',
    desc:'unvulmandu 코드로 만든 나만의 만두 스킨',
    rarity:'legendary',

  };

  state.generalSkins = state.generalSkins.filter(g=>g.id!==skin.id);
  state.generalSkins.push(skin);
  playChime('legendary');
  toast('일반 스킨 "만두 말랑이"를 생성했습니다!');
  renderAll();
}
/* keycap 코드: 기계식 키보드 스위치 사진으로 만든 '일반 스킨'. 원본이 흰 배경이라
   다른 이미지들과 동일하게 blend-photo(mix-blend-mode:multiply) 렌더링을 그대로 타서
   흰 배경이 원형 테마 배경색과 섞여 자연스럽게 사라짐. 장착 후 클릭할 때마다
   playPop()이 이 스킨의 customMascot('키캡')을 보고 playKeycapClack()으로 분기해서
   기계식 키보드가 '타다닥' 두드리는 듯한 전용 효과음을 냄 */
function createKeycapSkin(){
  if(!state.redeemedCodes) state.redeemedCodes = new Set();
  state.redeemedCodes.add('keycap');
  const skin = {
    id:'genskin-keycap',
    name:'키캡 말랑이',
    desc:'keycap 코드로 얻은 기계식 스위치 스킨',
    rarity:'legendary',
    customImg: KEYCAP_IMG,
    customFilter: 'saturate(1.15) contrast(1.06)',
    customMascot:'키캡'
  };
  if(!state.generalSkins) state.generalSkins = [];
  state.generalSkins = state.generalSkins.filter(g=>g.id!==skin.id);
  state.generalSkins.push(skin);
  playChime('legendary');
  toast('일반 스킨 "키캡 말랑이"를 획득했습니다!');
  renderAll();
}
function generateSaveCode(){
  const code = exportSaveCode();
  const out = document.getElementById('saveCodeOutput');
  if(out) out.value = code;
  toast('세이브 코드가 생성되었습니다');
}
function copySaveCode(){
  const out = document.getElementById('saveCodeOutput');
  if(!out || !out.value){ toast('먼저 코드를 생성해주세요'); return; }
  out.focus(); out.select();
  try{
    navigator.clipboard.writeText(out.value).then(()=> toast('복사되었습니다')).catch(()=> toast('직접 선택해서 복사해주세요'));
  }catch(e){ toast('직접 선택해서 복사해주세요'); }
}

function renderPanel(){
  const panel = document.getElementById('panel');
  if(state.activeTab==='gacha') panel.innerHTML = renderGachaPanel();
  else if(state.activeTab==='dex') panel.innerHTML = renderDexPanel();
  else if(state.activeTab==='fuse') panel.innerHTML = renderFusePanel();
  else if(state.activeTab==='fusedex') panel.innerHTML = renderFuseDexPanel();
  else if(state.activeTab==='settings') panel.innerHTML = renderSettingsPanel();
  attachPanelEvents();
}

function attachPanelEvents(){
  const byId = id => document.getElementById(id);
  if(state.activeTab==='gacha'){
    if(byId('btnCatMenu')) byId('btnCatMenu').onclick = ()=>{ state.gachaMenuOpen = !state.gachaMenuOpen; renderPanel(); };
    document.querySelectorAll('[data-gachastage]').forEach(btn=>{
      btn.onclick = ()=>{
        state.gachaStageView = parseInt(btn.dataset.gachastage,10);
        state.gachaMenuOpen = false;
        renderPanel();
      };
    });
    if(byId('btnNormalGacha')) byId('btnNormalGacha').onclick = doNormalGacha;
    if(byId('btnRareGacha')) byId('btnRareGacha').onclick = doRareGacha;
    if(byId('btnLegendaryGacha')) byId('btnLegendaryGacha').onclick = doLegendaryGacha;
    if(byId('btnNormalGacha10')) byId('btnNormalGacha10').onclick = doNormalGacha10;
    if(byId('btnRareGacha10')) byId('btnRareGacha10').onclick = doRareGacha10;
    if(byId('btnLegendaryGacha10')) byId('btnLegendaryGacha10').onclick = doLegendaryGacha10;
    if(byId('btnCraftRareTicket')) byId('btnCraftRareTicket').onclick = craftRareTicket;
    if(byId('btnCraftLegendaryTicket')) byId('btnCraftLegendaryTicket').onclick = craftLegendaryTicket;
    if(byId('btnFillRareFromLegendary')) byId('btnFillRareFromLegendary').onclick = fillRareFromLegendary;
  } else if(state.activeTab==='dex'){
    document.querySelectorAll('[data-dexstage]').forEach(btn=>{
      btn.onclick = ()=>{ state.dexStageView = parseInt(btn.dataset.dexstage,10); renderPanel(); };
    });
    document.querySelectorAll('[data-equip]').forEach(btn=>{
      btn.onclick = ()=>{
        ensureAudio();
        state.equippedId = btn.dataset.equip;
        const equippedType = TYPE_MAP.get(btn.dataset.equip);
        playPop(1.2, mascotFor(equippedType));
        toast(mascotFor(equippedType)+'를 장착했습니다');
        tintHero();
        renderHeader();
        renderPanel();
      };
    });
  } else if(state.activeTab==='fuse'){
    if(byId('btnFuse')) byId('btnFuse').onclick = attemptFuse;
  } else if(state.activeTab==='fusedex'){
    document.querySelectorAll('[data-equipskin]').forEach(btn=>{
      btn.onclick = ()=>{
        ensureAudio();
        const id = btn.dataset.equipskin;
        const skinObj = FUSE_SKINS.find(f=>f.id===id) || (state.generalSkins||[]).find(g=>g.id===id);
        state.equippedSkinId = (state.equippedSkinId===id) ? null : id;
        playPop(1.2, skinObj ? mascotFor(skinObj) : undefined);
        toast(state.equippedSkinId ? '스킨을 장착했습니다' : '스킨을 해제했습니다');
        tintHero();
        renderHeader();
        renderPanel();
      };
    });
  } else if(state.activeTab==='settings'){
    if(byId('btnToggleMute')) byId('btnToggleMute').onclick = ()=>{
      state.settings.muted = !state.settings.muted;
      if(!state.settings.muted) ensureAudio();
      renderPanel();
    };
    if(byId('volSlider')) byId('volSlider').oninput = (e)=>{
      state.settings.volume = Number(e.target.value)/100;
      const lbl = document.getElementById('volLabel');
      if(lbl) lbl.textContent = e.target.value+'%';
    };
    if(byId('btnSubmitCode')) byId('btnSubmitCode').onclick = submitCode;
    if(byId('codeInput')) byId('codeInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitCode(); });
    if(byId('btnGenerateSave')) byId('btnGenerateSave').onclick = generateSaveCode;
    if(byId('btnCopySave')) byId('btnCopySave').onclick = copySaveCode;
  }
}

function renderAll(){
  renderHeader();
  renderTabs();
  renderPanel();
}

/* ================= REVEAL / MODALS ================= */
function showReveal(type, result){
  const overlay = document.getElementById('revealOverlay');
  const revealImgEl = document.getElementById('revealImg');
  revealImgEl.src = imgFor(type);
  revealImgEl.style.filter = filterFor(type);
  revealImgEl.classList.toggle('rainbow-img', !!type.rainbowEffect);
  const fruitOv = document.getElementById('revealFruitOverlay');
  const fruitBg = fruitOverlayBg(type);
  if(fruitBg){ fruitOv.style.background = fruitBg; fruitOv.style.display = 'block'; }
  else { fruitOv.style.display = 'none'; }
  const ring = document.getElementById('revealRing');
  ring.querySelectorAll('.ring').forEach(r=>r.remove());
  if(type.rarity!=='common'){
    const r = document.createElement('div');
    r.className = 'ring '+type.rarity;
    ring.insertBefore(r, ring.firstChild);
  }
  const tag = document.getElementById('revealTag');
  tag.textContent = RARITY_LABEL[type.rarity];
  tag.className = 'reveal-tag dex-rarity '+type.rarity;
  document.getElementById('revealName').textContent = type.name+' '+mascotFor(type);
  let statusText;
  if(result.isNew) statusText = '새로운 도감 등록!';
  else if(result.restocked) statusText = '다시 보유하게 되었습니다';
  else if(result.stacked) statusText = '중복! '+RARITY_LABEL[type.rarity]+' 마일리지 +1 · 도감 보유 개수 +1';
  else statusText = '중복! '+RARITY_LABEL[type.rarity]+' 마일리지 +1';
  document.getElementById('revealNew').textContent = statusText;
  overlay.classList.add('show');
}
document.getElementById('revealClose').onclick = ()=> document.getElementById('revealOverlay').classList.remove('show');
document.getElementById('revealOk').onclick = ()=> document.getElementById('revealOverlay').classList.remove('show');

function showReveal10(rolls){
  const grid = document.getElementById('reveal10Grid');
  let newCount = 0, stackedCount = 0;
  const mileageGain = {common:0, rare:0, legendary:0};
  grid.innerHTML = rolls.map(r=>{
    if(r.coinsOnly){
      return '<div class="reveal10-item coin-bonus">'+
        '<div class="reveal10-thumb-wrap">'+ICONS.coin+'</div>'+
        '<div class="reveal10-name">+'+fmt(r.amount)+'</div>'+
        '<div class="reveal10-tag" style="background:var(--legend-bg); color:var(--legend);">코인</div>'+
      '</div>';
    }
    const type = r.type, res = r.result;
    if(res.isNew) newCount++;
    if(res.mileage) mileageGain[type.rarity] = (mileageGain[type.rarity]||0)+1;
    if(res.stacked) stackedCount++;
    const ringClass = ringClassFor(type);
    return '<div class="reveal10-item">'+
      '<div class="reveal10-thumb-wrap">'+
        (ringClass?'<div class="'+ringClass+'"></div>':'')+
        thumbHtml(type,{size:44})+
      '</div>'+
      '<div class="reveal10-name">'+type.name+'</div>'+
      '<div class="reveal10-tag dex-rarity '+type.rarity+'">'+RARITY_LABEL[type.rarity]+(res.isNew?' NEW':'')+'</div>'+
    '</div>';
  }).join('');
  const parts = [];
  if(newCount>0) parts.push('신규 도감 '+newCount+'개');
  ['common','rare','legendary'].forEach(k=>{
    if(mileageGain[k]>0) parts.push(RARITY_LABEL[k]+' 마일리지 +'+mileageGain[k]);
  });
  if(stackedCount>0) parts.push('도감 보유 개수 +'+stackedCount);
  document.getElementById('reveal10Summary').textContent = parts.length ? parts.join(' · ') : '결과를 확인하세요';
  document.getElementById('reveal10Overlay').classList.add('show');
}
document.getElementById('reveal10Close').onclick = ()=> document.getElementById('reveal10Overlay').classList.remove('show');
document.getElementById('reveal10Ok').onclick = ()=> document.getElementById('reveal10Overlay').classList.remove('show');

/* ================= CLICK / FLOAT COIN ================= */
const dumplingBtn = document.getElementById('dumplingBtn');
const dumplingImg = document.getElementById('dumplingImg');
const floatLayer = document.getElementById('floatLayer');

function spawnFloat(x, y, text, crit){
  const span = document.createElement('div');
  span.className = 'float-coin'+(crit?' crit':'');
  span.textContent = text;
  span.style.left = x+'px';
  span.style.top = y+'px';
  floatLayer.appendChild(span);
  setTimeout(()=> span.remove(), 950);
}

dumplingBtn.addEventListener('click', (e)=>{
  ensureAudio();
  const crit = Math.random() < 0.1;
  const base = baseClickValue();
  const variance = 0.85 + Math.random()*0.4;
  let gain = Math.max(1, Math.round(base*variance));
  if(crit) gain *= 5;
  state.coins += gain;
  const eq = getEquippedType();
  const skin = getEquippedSkin();
  const clickMascot = mascotFor(skin || eq);
  playPop(crit ? 1.6 : (eq && eq.rarity==='legendary' ? 1.25 : eq && eq.rarity==='rare' ? 1.12 : 1), clickMascot);

  const rect = dumplingBtn.getBoundingClientRect();
  const x = (e.clientX!==undefined ? e.clientX - rect.left : rect.width/2) - 10;
  const y = (e.clientY!==undefined ? e.clientY - rect.top : rect.height/2) - 10;
  spawnFloat(x, y, '+'+gain, crit);

  dumplingImg.classList.remove('squish');
  void dumplingImg.offsetWidth;
  dumplingImg.classList.add('squish');

  renderHeader();
  // keep gacha button enabled-state fresh if visible
  if(state.activeTab==='gacha') renderPanel();
});

/* Reflect the currently equipped (clickable) dumpling on the hero image */
function tintHero(){
  const eq = getEquippedType();
  const skin = getEquippedSkin();
  const visual = skin || eq;
  dumplingImg.src = imgFor(visual);
  if(visual){
    dumplingImg.style.filter = filterFor(visual);
  } else {
    dumplingImg.style.filter = 'saturate(1.1)';
  }
  dumplingImg.classList.remove('rainbow-img','cosmic-img');
  const st = skinStyle(skin);
  if(st==='rainbow') dumplingImg.classList.add('rainbow-img');
  else if(st==='cosmic') dumplingImg.classList.add('cosmic-img');
  else if(!skin && eq && eq.rainbowEffect) dumplingImg.classList.add('rainbow-img');
  const heroFruitOv = document.getElementById('heroFruitOverlay');
  const heroFruitBg = skin ? null : fruitOverlayBg(eq); // 스킨을 장착 중이면 도감 과일 무늬 대신 스킨 외형 우선
  if(heroFruitBg){ heroFruitOv.style.background = heroFruitBg; heroFruitOv.style.display = 'block'; }
  else { heroFruitOv.style.display = 'none'; }
  const label = document.getElementById('equippedLabel');
  if(label){
    let text = eq
      ? ('수익 '+mascotFor(eq)+': '+eq.name+' '+mascotFor(eq)+' · '+RARITY_LABEL[eq.rarity])
      : '수익 만두: 기본 만두 · 도감에서 만두를 장착해보세요';
    if(skin) text += '  ·  스킨: '+skin.name;
    label.textContent = text;
  }
}

/* ================= BONUS MALLANGI (랜덤 등장 보너스) ================= */
/* 2~3분의 랜덤한 시간마다 화면 어딘가에 작은 말랑이가 나타나고, 누르면 지금 소지한
   코인의 30~50%를 즉시 보너스로 줌. 안 누르면 잠시 후 사라지고 다음 랜덤 시간에 다시 등장 */
const bonusEl = document.getElementById('bonusMallang');
const bonusImgEl = document.getElementById('bonusMallangImg');
let bonusHideTimer = null;
let bonusNextTimer = null;
const BONUS_MIN_PCT = 0.3, BONUS_MAX_PCT = 0.5;
const BONUS_VISIBLE_MS = 8000;

function randomBonusDelay(){ return randInt(120000, 180000); } /* 2~3분 */

function placeBonusRandomly(){
  const size = 76, margin = 12;
  const topMin = 110;                                            /* 상단 바를 피함 */
  const topMax = Math.max(topMin + 40, window.innerHeight - 170); /* 하단 탭바를 피함 */
  const leftMax = Math.max(margin, window.innerWidth - size - margin);
  bonusEl.style.left = randInt(margin, leftMax) + 'px';
  bonusEl.style.top = randInt(topMin, topMax) + 'px';
}

function spawnBonusMallang(){
  if(bonusEl.classList.contains('show')) return; /* 이미 떠 있으면 중복 등장 방지 */
  const skin = getEquippedSkin();
  const eq = getEquippedType();
  const visual = skin || eq;
  bonusImgEl.src = visual ? imgFor(visual) : currentStage().img;
  bonusImgEl.style.filter = visual ? filterFor(visual) : 'saturate(1.3)';
  placeBonusRandomly();
  bonusEl.classList.remove('leaving');
  bonusEl.classList.add('show');
  clearTimeout(bonusHideTimer);
  bonusHideTimer = setTimeout(()=> dismissBonusMallang(), BONUS_VISIBLE_MS);
}

function dismissBonusMallang(){
  if(!bonusEl.classList.contains('show')) return;
  clearTimeout(bonusHideTimer);
  bonusEl.classList.add('leaving');
  setTimeout(()=> bonusEl.classList.remove('show','leaving'), 280);
  scheduleBonusMallang();
}

function scheduleBonusMallang(){
  clearTimeout(bonusNextTimer);
  bonusNextTimer = setTimeout(spawnBonusMallang, randomBonusDelay());
}

function spawnBonusFloat(text){
  const rect = bonusEl.getBoundingClientRect();
  const span = document.createElement('div');
  span.className = 'float-coin crit';
  span.style.position = 'fixed';
  span.style.left = (rect.left + rect.width/2 - 10) + 'px';
  span.style.top = rect.top + 'px';
  span.style.zIndex = 95;
  span.textContent = text;
  document.body.appendChild(span);
  setTimeout(()=> span.remove(), 950);
}

bonusEl.addEventListener('click', ()=>{
  ensureAudio();
  const pct = BONUS_MIN_PCT + Math.random()*(BONUS_MAX_PCT-BONUS_MIN_PCT);
  const gain = Math.max(0, Math.round(state.coins*pct));
  state.coins += gain;
  playChime('legendary');
  toast('보너스 말랑이! 소지금의 '+Math.round(pct*100)+'% · +'+fmt(gain)+' 코인');
  spawnBonusFloat('+'+fmt(gain));
  renderHeader();
  dismissBonusMallang();
});

/* ================= DEV: 콘솔 단계 이동 코드 ================= */
/* 브라우저 개발자도구 콘솔을 열고 jumpToStage(원하는 단계 번호)를 입력하면
   해당 단계로 즉시 이동함. 예: jumpToStage(5) → 5단계로 이동
   1보다 작은 값은 1단계로, 아직 만들어지지 않은 먼 단계는 그 자리에서 자동 생성됨 */
function jumpToStage(n){
  const num = Math.max(1, Math.floor(Number(n)||1));
  const idx = num-1;
  ensureStageBuilt(idx);
  state.stageIndex = idx;
  state.gachaStageView = idx;
  state.dexStageView = idx;
  initStageRuntime(idx);
  tintHero();
  renderAll();
  toast(STAGES[idx].title+'(으)로 이동했습니다');
  console.log('[jumpToStage] 현재 단계:', STAGES[idx].title);
  return STAGES[idx].title;
}
window.jumpToStage = jumpToStage;
