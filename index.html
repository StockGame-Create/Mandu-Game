<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Malang 1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E4;
    --paper:#FFFDF8;
    --ink:#2B2420;
    --ink-soft:#6b6156;
    --line:#E7DCC7;
    --bamboo:#6B8F71;
    --bamboo-dark:#4f6d55;
    --chili:#C1440E;
    --chili-dark:#9c360b;
    --gold:#E0A458;
    --common:#7C9885;
    --common-bg:#EAF1EC;
    --rare:#3E7CB1;
    --rare-bg:#E7F1FA;
    --legend:#C1440E;
    --legend-bg:#FBEAE0;
    --shadow: 0 4px 14px rgba(43,36,32,0.10);
    /* 단계별 테마 색상 - JS에서 단계가 바뀔 때마다 덮어씌워짐 */
    --stage-a:#6B8F71;
    --stage-b:#4f6d55;
    --stage-bg:#FAF3E4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;
    overflow:hidden;               /* 바깥(뷰포트) 스크롤/바운스 차단 */
    overscroll-behavior:none;      /* 당겨서 새로고침 등 브라우저 제스처 차단 */
    touch-action:pan-y;            /* 세로 스크롤은 허용하되 핀치줌은 차단 */
    -webkit-text-size-adjust:100%;
  }
  body{
    background:
      radial-gradient(circle at 15% 0%, #fff8ec 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    position:fixed;
    inset:0;
    width:100%;
  }
  h1,h2,h3, .display{ font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; }
  #app{
    max-width:720px; margin:0 auto;
    padding:14px 14px calc(84px + env(safe-area-inset-bottom));
    height:100%;
    overflow-y:auto;               /* 실제 콘텐츠 스크롤은 #app 내부에서만 */
    overflow-x:hidden;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 4px 12px;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .badge-dot{ width:10px;height:10px;border-radius:50%; background:var(--chili); box-shadow:0 0 0 3px var(--legend-bg);}
  .brand h1{ font-size:22px; margin:0; letter-spacing:0.5px; color:var(--ink); }
  .brand .sub{ font-size:11px; color:var(--ink-soft); margin-top:-2px; }
  .stats{ display:flex; gap:8px; }
  .stat-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 12px 6px 8px; box-shadow:var(--shadow); font-weight:700; font-size:14px;
    white-space:nowrap;
  }
  .stat-pill .ic{ color:var(--gold); display:flex; }
  .stat-pill.ticket .ic{ color:var(--chili); }
  .stat-pill.gem .ic{ color:var(--rare); }

  .stage-strip{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(90deg, var(--stage-a), var(--stage-b));
    color:#fff; border-radius:14px; padding:10px 16px; margin-bottom:14px;
    box-shadow:var(--shadow); transition:background .4s ease;
  }
  .stage-strip .st-title{ font-family:'Jua'; font-size:16px; }
  .stage-strip .st-desc{ font-size:11.5px; opacity:0.85; margin-top:2px;}
  .stage-strip .st-num{
    font-family:'Jua'; font-size:26px; background:rgba(255,255,255,0.18);
    border-radius:10px; padding:2px 12px;
  }

  /* ---------- Hero: steamer ---------- */
  .hero{
    position:relative;
    background: var(--paper);
    border:1.5px solid var(--line);
    border-radius:22px;
    padding:26px 20px 18px;
    text-align:center;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:14px;
  }
  .hero::before{ /* woven bamboo rim */
    content:'';
    position:absolute; left:0; right:0; top:0; height:10px;
    background: repeating-linear-gradient(90deg, var(--bamboo) 0 10px, var(--bamboo-dark) 10px 20px);
    opacity:0.9;
  }
  .steam-wrap{ position:relative; height:60px; margin-bottom:-18px; }
  .steam-puff{
    position:absolute; bottom:0; width:16px; height:26px; border-radius:50%;
    background:rgba(255,255,255,0.85); filter:blur(5px);
    animation:steamRise 3.2s ease-in infinite;
  }
  @keyframes steamRise{
    0%{ transform:translateY(0) scale(0.8); opacity:0; }
    18%{ opacity:0.55; }
    100%{ transform:translateY(-70px) scale(1.7); opacity:0; }
  }
  .basket{
    position:relative; width:220px; height:190px; margin:0 auto;
  }
  .basket-ring{
    position:absolute; left:50%; top:100%; transform:translate(-50%,-14px);
    width:230px; height:26px; border-radius:50%;
    background: repeating-linear-gradient(90deg, var(--stage-a) 0 8px, var(--stage-b) 8px 16px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.06); transition:background .4s ease;
  }
  .dumpling-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; /* 더블탭 확대만 차단, click 이벤트/연타는 그대로 즉시 통과 */
  }
  .hero-backdrop{
    position:absolute; width:180px; height:180px; border-radius:50%;
    background: var(--stage-bg);
    box-shadow: 0 14px 22px -6px rgba(43,36,32,0.28), inset 0 0 0 1px rgba(43,36,32,0.04);
    transition:background .4s ease;
  }
  .dumpling-wrap img{
    position:relative; width:172px; height:172px; object-fit:contain;
    mix-blend-mode:multiply; border-radius:50%; overflow:hidden;
    transition: transform .15s ease;
  }
  .dumpling-wrap:active img{ transform:scale(0.97); }
  @keyframes squish{
    0%{ transform:scale(1); }
    28%{ transform:scale(0.82,1.18); }
    52%{ transform:scale(1.12,0.9); }
    75%{ transform:scale(0.95,1.05); }
    100%{ transform:scale(1); }
  }
  .squish{ animation: squish .38s ease; }
  .hero-hint{ margin-top:8px; font-size:12px; color:var(--ink-soft); }
  .float-layer{ position:absolute; inset:0; pointer-events:none; }
  .float-coin{
    position:absolute; font-family:'Jua'; font-weight:400; color:var(--chili);
    font-size:16px; animation: floatUp .9s ease-out forwards; pointer-events:none;
  }
  .float-coin.crit{ color:var(--gold); font-size:22px; text-shadow:0 0 8px rgba(224,164,88,0.6); }
  @keyframes floatUp{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(-64px); opacity:0; }
  }
  .per-click{ position:absolute; top:10px; right:16px; font-size:11px; color:var(--ink-soft); background:var(--common-bg); border-radius:8px; padding:3px 8px;}
  .auto-income{ position:absolute; top:10px; left:16px; font-size:11px; color:var(--legend); background:var(--legend-bg); border-radius:8px; padding:3px 8px; display:none;}
  .auto-income.show{ display:block; }

  /* ---------- Tabs (bottom fixed nav) ---------- */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    display:flex; gap:6px;
    max-width:720px; margin:0 auto;
    background:rgba(255,253,248,0.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1.5px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(43,36,32,0.10);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:transparent; border:none; border-radius:12px;
    padding:6px 4px 5px; font-family:'Noto Sans KR'; font-weight:700; font-size:10.5px;
    color:var(--ink-soft); cursor:pointer; transition:all .15s ease; touch-action:manipulation;
  }
  .tab-btn svg{ width:19px; height:19px; transition:transform .15s ease; }
  .tab-btn.active{ background:var(--ink); color:#fff; box-shadow:var(--shadow); }
  .tab-btn.active svg{ transform:translateY(-1px) scale(1.05); }
  .tab-btn:active svg{ transform:scale(0.9); }

  .panel{
    background:var(--paper); border:1.5px solid var(--line); border-radius:18px;
    padding:16px; box-shadow:var(--shadow); min-height:200px;
  }
  .panel h2{ margin:0 0 4px; font-size:18px; }
  .panel .lead{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  /* ---------- Gacha cards ---------- */
  .gacha-card{
    display:flex; flex-direction:column; gap:10px;
    border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    background:linear-gradient(180deg, #fff, #fffaf1);
  }
  .gacha-card-top{ display:flex; align-items:center; gap:14px; }
  .g-actions{ display:flex; gap:8px; }
  .g-actions .btn{ flex:1; }
  .btn-sm{ font-size:11px; padding:8px 6px; white-space:normal; line-height:1.3; }
  .gacha-card .g-icon{
    width:52px;height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--common-bg); color:var(--bamboo-dark); flex-shrink:0;
  }
  .gacha-card.ticket .g-icon{ background:var(--legend-bg); color:var(--chili); }
  .gacha-card.ticket.legend .g-icon{ background:linear-gradient(135deg,var(--gold),var(--chili)); color:#fff; }
  .gacha-card .g-owned{ font-weight:700; font-size:10.5px; color:var(--ink-soft); background:var(--common-bg); border-radius:999px; padding:1px 8px; margin-left:6px; }
  .mileage-strip{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .mileage-pill{
    display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    border-radius:999px; padding:6px 12px; background:var(--common-bg); color:var(--common);
  }
  .mileage-pill.rare{ background:var(--rare-bg); color:var(--rare); }
  .mileage-pill b{ color:var(--ink); font-family:'Jua'; font-weight:400; }

  /* ---------- Gacha category hamburger menu ---------- */
  .gacha-cat-select{ position:relative; margin-bottom:12px; }
  .cat-hamburger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:#fff;
    font-family:'Noto Sans KR'; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
    box-shadow:var(--shadow);
  }
  .cat-hb-left{ display:flex; align-items:center; gap:10px; }
  .cat-hamburger svg{ flex-shrink:0; color:var(--stage-a); }
  .cat-menu{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:60;
    background:var(--paper); border:1.5px solid var(--line); border-radius:16px;
    box-shadow:0 14px 30px rgba(43,36,32,0.18); padding:8px; max-height:280px; overflow-y:auto;
    display:none;
  }
  .cat-menu.open{ display:block; }
  .cat-menu-item{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 12px; border-radius:12px; border:none; background:transparent;
    font-family:'Noto Sans KR'; font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer;
    text-align:left;
  }
  .cat-menu-item:not(:last-child){ margin-bottom:2px; }
  .cat-menu-item:hover{ background:var(--common-bg); }
  .cat-menu-item.active{ background:var(--stage-a); color:#fff; }
  .cat-item-tag{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; background:rgba(0,0,0,0.08); }
  .cat-menu-item.active .cat-item-tag{ background:rgba(255,255,255,0.25); }
  .cat-item-tag.past{ background:var(--legend-bg); color:var(--legend); }
  .cat-menu-item.active .cat-item-tag.past{ background:rgba(255,255,255,0.25); color:#fff; }

  /* ---------- Coin shortage warning ---------- */
  .coin-warning{
    display:flex; align-items:flex-start; gap:10px; background:#FDE8E4; color:#8a2f10;
    border:1.5px solid var(--chili); border-radius:14px; padding:12px 14px; margin-bottom:12px;
    font-size:12.5px; font-weight:700; line-height:1.5;
  }
  .coin-warning svg{ flex-shrink:0; color:var(--chili); margin-top:1px; }

  /* ---------- Mileage board (bigger, per-category) ---------- */
  .mileage-board{
    background:linear-gradient(135deg, var(--stage-bg), #fff);
    border:1.5px solid var(--line); border-radius:18px; padding:14px 16px 16px; margin-bottom:14px;
    box-shadow:var(--shadow); transition:background .4s ease;
  }
  .mb-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .mb-row{ display:flex; gap:10px; }
  .mb-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 10px;
  }
  .mb-item svg{ width:18px; height:18px; margin-bottom:2px; }
  .mb-item.common svg{ color:var(--common); }
  .mb-item.rare svg{ color:var(--rare); }
  .mb-item.legendary svg{ color:var(--legend); }
  .mb-num{ font-family:'Jua'; font-size:28px; line-height:1; color:var(--ink); }
  .mb-item.common .mb-num{ color:var(--common); }
  .mb-item.rare .mb-num{ color:var(--rare); }
  .mb-item.legendary .mb-num{ color:var(--legend); }
  .mb-label{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:2px; }

  .gacha-card .g-body{ flex:1; }
  .gacha-card .g-title{ font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .gacha-card .g-odds{ font-size:11px; color:var(--ink-soft); }
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-weight:700; font-size:13px;
    cursor:pointer; font-family:'Noto Sans KR'; transition:transform .1s ease, opacity .15s;
    white-space:nowrap; touch-action:manipulation;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--chili); color:#fff; }
  .btn-primary:disabled{ background:#d8cfc0; color:#948a7c; cursor:not-allowed; }
  .btn-ghost{ background:var(--ink); color:#fff; }
  .btn-ghost:disabled{ background:#d8cfc0; color:#948a7c; cursor:not-allowed; }
  .btn-outline{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }

  .craft-row{
    display:flex; align-items:center; gap:12px; border:1.5px dashed var(--line);
    border-radius:14px; padding:12px 14px;
  }
  .craft-row .prog{ flex:1; }
  .prog-bar{ height:8px; background:var(--common-bg); border-radius:999px; overflow:hidden; margin-top:6px;}
  .prog-fill{ height:100%; background:var(--bamboo); border-radius:999px; transition:width .3s ease;}

  /* ---------- Dex ---------- */
  .dex-tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .dex-tab{
    font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .dex-tab.active{ background:var(--bamboo); color:#fff; border-color:var(--bamboo); }
  .dex-progress{ font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
  .dex-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:10px;
  }
  .dex-item{
    border:1.5px solid var(--line); border-radius:12px; padding:8px 6px 10px; text-align:center;
    background:#fff; position:relative;
  }
  .dex-thumb-wrap{ position:relative; width:56px; height:56px; margin:0 auto 6px; }
  .thumb-circle{ position:relative; z-index:2; }
  .blend-photo{ mix-blend-mode:multiply; }
  .lock-badge{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; color:#fff; }
  .ring{ position:absolute; inset:-4px; border-radius:50%; z-index:1; }
  .ring.rare{ background:conic-gradient(from 0deg, var(--rare), #a9d8ff, var(--rare)); animation:spin 3s linear infinite; opacity:0.9;}
  .ring.legendary{ background:conic-gradient(from 0deg, var(--gold), var(--chili), var(--gold)); animation:spin 2.2s linear infinite; opacity:0.95;}
  /* 무지개 퓨즈 스킨: 12색을 모두 도는 링 + 이미지 자체도 12단계로 색이 바뀜 */
  .ring.rainbow{
    background:conic-gradient(from 0deg,
      #FF0000,#FF7F00,#FFD400,#CFFF00,#4CD964,#00E0A8,
      #00C2FF,#3E7CFF,#7A5CFF,#C24CFF,#FF4CD8,#FF0000);
    animation:spin 3.4s linear infinite; opacity:0.85;
  }
  @keyframes rainbow12{
    0%{ filter:hue-rotate(0deg) saturate(1.55) brightness(0.92); }
    8.33%{ filter:hue-rotate(30deg) saturate(1.55) brightness(0.92); }
    16.66%{ filter:hue-rotate(60deg) saturate(1.55) brightness(0.92); }
    25%{ filter:hue-rotate(90deg) saturate(1.55) brightness(0.92); }
    33.33%{ filter:hue-rotate(120deg) saturate(1.55) brightness(0.92); }
    41.66%{ filter:hue-rotate(150deg) saturate(1.55) brightness(0.92); }
    50%{ filter:hue-rotate(180deg) saturate(1.55) brightness(0.92); }
    58.33%{ filter:hue-rotate(210deg) saturate(1.55) brightness(0.92); }
    66.66%{ filter:hue-rotate(240deg) saturate(1.55) brightness(0.92); }
    75%{ filter:hue-rotate(270deg) saturate(1.55) brightness(0.92); }
    83.33%{ filter:hue-rotate(300deg) saturate(1.55) brightness(0.92); }
    91.66%{ filter:hue-rotate(330deg) saturate(1.55) brightness(0.92); }
    100%{ filter:hue-rotate(360deg) saturate(1.55) brightness(0.92); }
  }
  .rainbow-img{ animation: rainbow12 6s steps(12) infinite !important; }
  /* 4단계 퓨즈 스킨: 우주 별 이펙트 (별 반짝이는 배경 + 은은한 발광 펄스) */
  .ring.cosmic{
    background:
      radial-gradient(circle at 18% 26%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 72% 18%, #fff 0 1.4px, transparent 2.4px),
      radial-gradient(circle at 40% 78%, #fff 0 1.6px, transparent 2.6px),
      radial-gradient(circle at 84% 62%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 58% 46%, #fff 0 1.2px, transparent 2.2px),
      radial-gradient(circle at 14% 66%, #fff 0 1.2px, transparent 2.2px),
      radial-gradient(circle at 88% 88%, #fff 0 1.4px, transparent 2.4px),
      radial-gradient(circle, #3a2a7a, #0b0f2e 72%);
    animation: cosmicTwinkle 2.2s ease-in-out infinite alternate;
    opacity:0.95;
  }
  @keyframes cosmicTwinkle{ 0%{ opacity:0.7; } 100%{ opacity:1; filter:brightness(1.2); } }
  @keyframes cosmicPulse{
    0%{ filter:saturate(2.3) brightness(1.05) contrast(1.1); }
    50%{ filter:saturate(2.9) brightness(1.25) contrast(1.2); }
    100%{ filter:saturate(2.3) brightness(1.05) contrast(1.1); }
  }
  .cosmic-img{ animation: cosmicPulse 2.4s ease-in-out infinite !important; }
  /* 2n단계(짝수 단계) 퓨즈 스킨: 항상 은하계 테마 - 보라색과 하늘색이 겹쳐진 링 위에
     별가루가 뿌려지고, 이미지 자체도 화려하게 채도/밝기가 펄스침 */
  .ring.galaxy{
    background:
      radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 75% 20%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 45% 80%, #fff 0 1.8px, transparent 2.8px),
      radial-gradient(circle at 85% 65%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 15% 65%, #fff 0 1.3px, transparent 2.3px),
      radial-gradient(circle at 60% 45%, #fff 0 1.4px, transparent 2.4px),
      conic-gradient(from 0deg, #7A5CFF, #5AA9D6, #C24CFF, #5AA9D6, #7A5CFF);
    animation: spin 3.6s linear infinite, galaxyTwinkle 2s ease-in-out infinite alternate;
    opacity:0.85;
  }
  @keyframes galaxyTwinkle{ 0%{ opacity:0.8; } 100%{ opacity:1; filter:brightness(1.12) saturate(1.12); } }
  /* 2n번째(짝수) 스킨은 앞으로 항상 "색상 반전(보색)" 컨셉으로 고정. CSS invert()는
     mix-blend-mode:multiply와 함께 쓰면 흰 배경이 검정으로 뒤집혀 사진 전체가 새까맣게
     칠해져버리는 문제가 있어서 쓰지 않음. 대신 그 만두 고유 색상의 정반대(보색, +180deg)
     로 hue-rotate만 걸어 실제로 "반전된 색"이 보이면서도 흰 배경은 그대로 흰색이라
     투명하게 잘 사라짐. --ghue는 각 아이템마다 JS에서 인라인으로 지정됨 */
  @keyframes galaxyPulse{
    0%{ filter:hue-rotate(var(--ghue,200deg)) saturate(1.5) brightness(1.05) contrast(1.08); }
    50%{ filter:hue-rotate(calc(var(--ghue,200deg) + 20deg)) saturate(1.7) brightness(1.12) contrast(1.14); }
    100%{ filter:hue-rotate(var(--ghue,200deg)) saturate(1.5) brightness(1.05) contrast(1.08); }
  }
  .galaxy-img{ animation: galaxyPulse 2.6s ease-in-out infinite !important; }
  /* 먹색/흑진주처럼 아주 짙은 색 만두는 다른 만두들과 달리 바깥 테두리가 동그랗지 않고
     사각으로 각져있는 전용 프레임을 씀 (도감/퓨즈 도감 등 개수로 표시되는 모든 곳에 공통 적용) */
  .ring.ring-square{ border-radius:10px; background:linear-gradient(135deg,#3a332c,#000); opacity:0.9; animation:none; }
  /* 과일 만두: 색만 다른 게 아니라 과일 특유의 무늬(씨앗/줄무늬/과육 결 등)를 이미지 위에 겹쳐 보여줌.
     기존 opacity 0.6은 무늬가 너무 또렷하게 도장 찍힌 것처럼 보여서 훨씬 은은하게 비치도록 낮춤 */
  .fruit-overlay{
    position:absolute; inset:0; border-radius:50%;
    pointer-events:none; mix-blend-mode:soft-light; opacity:0.38;
  }

    position:absolute; width:172px; height:172px; top:50%; left:50%;
    transform:translate(-50%,-50%); border-radius:50%;

  }
  .reveal-fruit-overlay{
    position:absolute; inset:14px; border-radius:50%; z-index:3;
    pointer-events:none; mix-blend-mode:soft-light; opacity:0.38; display:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* ---------- Bonus Mallangi (random coin bonus popup) ---------- */
  .bonus-mallang{
    position:fixed; width:76px; height:76px; z-index:90;
    display:none; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .bonus-mallang.show{ display:flex; animation: bonusPopIn .5s cubic-bezier(.34,1.56,.64,1); }
  .bonus-mallang.leaving{ animation: bonusPopOut .28s ease forwards; }
  .bonus-mallang-glow{
    position:absolute; inset:-10px; border-radius:50%;
    background: radial-gradient(circle, rgba(224,164,88,0.55) 0%, transparent 70%);
    animation: bonusGlowPulse 1.1s ease-in-out infinite;
  }
  .bonus-mallang img{
    position:relative; width:100%; height:100%; object-fit:contain;
    mix-blend-mode:multiply; filter:saturate(1.6) brightness(1.08);
    border-radius:50%; overflow:hidden;
    animation: bonusBob 1.3s ease-in-out infinite;
  }
  .bonus-mallang-tag{
    position:absolute; top:-10px; right:-6px; font-family:'Jua'; font-size:11px;
    color:#fff; background:var(--chili); border-radius:999px; padding:2px 8px;
    box-shadow:0 3px 8px rgba(43,36,32,0.25); animation: bonusTagWiggle 1.6s ease-in-out infinite;
  }
  @keyframes bonusPopIn{
    0%{ transform:scale(0.2); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes bonusPopOut{
    0%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(0.2); opacity:0; }
  }
  @keyframes bonusGlowPulse{
    0%,100%{ opacity:0.55; transform:scale(0.94); }
    50%{ opacity:0.95; transform:scale(1.08); }
  }
  @keyframes bonusBob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-7px) rotate(2deg); }
  }
  @keyframes bonusTagWiggle{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(6deg); }

    position:absolute; top:16px; right:22px; width:44px; height:44px; border-radius:50%;

  .pg-cloud.c1{ width:70px; height:22px; top:34px; left:8%; animation:pgCloudDrift 26s linear infinite; }
  .pg-cloud.c2{ width:52px; height:18px; top:60px; left:55%; animation:pgCloudDrift 34s linear infinite reverse; }
  @keyframes pgCloudDrift{ from{ transform:translateX(-16px);} to{ transform:translateX(26px);} }

  .pg-furniture-emoji{ font-size:34px; filter:drop-shadow(0 5px 4px rgba(43,36,32,0.28)); transition:transform .12s ease; line-height:1; }

  .pg-pet-img-wrap{ display:inline-block; border-radius:50%; }
  .pg-pet-remove{
    position:absolute; top:-6px; right:-2px; background:var(--common-bg); border:none; border-radius:50%;

   테마 특색이 없었음. 이제 과일마다 실제 과일 색에 맞는 고유 색상각을 지정함 */
const FRUIT_HUE_MAP = {

  '키위':{hue:96}, '블루베리':{hue:232, sat:1.2}, '망고':{hue:36}, '체리':{hue:348},

  '용과':{hue:330}, '두리안':{hue:78, sat:1.1}, '스타프루트':{hue:64}, '패션프루트':{hue:42},
  '리치':{hue:6}, '망고스틴':{hue:298, sat:1.2}, '구아바':{hue:108},
  '황금사과':{hue:46, sat:1.5, bri:1.15}, '천상의 복숭아':{hue:340, sat:1.1, bri:1.1},
  '무지개멜론':{hue:320, rainbow:true}
};
function buildTypes(def){
  /* 이 두 단계는 이름=색 이름이라 정확한 색상 매핑(COLOR_HUE_MAP)을 쓰고,
     과일 단계는 FRUIT_HUE_MAP을 씀. 나머지 단계는 기존처럼 균등 분할 hue를 그대로 씀 */
  const nkey = def.namedKey || def.key;
  const namedMap = (nkey==='color' || nkey==='cheese-color' || nkey==='butter-color' || nkey==='capybara-color' || nkey==='paw-color' || nkey==='icecream-color') ? COLOR_HUE_MAP
    : nkey==='fruit' ? FRUIT_HUE_MAP : null;
  function makeOne(name, i, rarity, hueFallback){
    const named = namedMap ? namedMap[name] : null;
    const base = {
      id: def.key+'-'+rarity[0]+i, name, rarity, stage:def.key,
      hue: named ? named.hue : hueFallback
    };
    if(named){
      base.colorize = true;
      if(named.sat!=null) base.colorSat = named.sat;
      if(named.bri!=null) base.colorBri = named.bri;
      if(named.rainbow) base.rainbowEffect = true;
    }
    return base;
  }
  const common = def.common.map((name,i)=> makeOne(name, i, 'common', Math.round(i*(360/def.common.length))));
  const rare = def.rare.map((name,i)=> makeOne(name, i, 'rare', Math.round(18+i*(360/def.rare.length))));
  const legendary = def.legendary.map((name,i)=> makeOne(name, i, 'legendary', Math.round(30+i*(360/def.legendary.length))));
  return common.concat(rare, legendary);
}

/* title 앞의 "N단계 ·"는 배열 위치(i)로 자동 계산해서 붙임 → 중간에 단계를 추가/삭제해도
   번호 표기가 절대 어긋나지 않음. img/mascot은 각 단계의 기본 말랑이 이미지/이름(예: 만두, 치즈) */
const STAGES = STAGE_DEFS.map((def,i)=>({
  key:def.key, title:(i+1)+'단계 · '+def.title, desc:def.desc,
  theme:def.theme, filter:def.filter,
  img: def.img || DUMPLING_IMG, mascot: def.mascot || '만두',
  types: buildTypes(def),
  shop:{ commonPrice:0, rarePrices:{}, legendaryPrices:{}, nextRefresh:0 },
  fuseReq:null
}));

const TYPE_MAP = new Map();
STAGES.forEach(s=> s.types.forEach(t=> TYPE_MAP.set(t.id,t)));

/* 아직 준비되지 않은 이후 단계로의 진입을 막기 위한 공사중 경계선.
   여기 적힌 값(0-based 단계 인덱스) 이상인 단계는 '공사중'으로 취급해서 퓨즈로 넘어갈 수 없음.
   즉 STAGES[CONSTRUCTION_LVL] 이상(현재 값 12 → 13단계)부터 잠김. 1~12단계는 모두 플레이 가능.
   나중에 새 단계 콘텐츠가 준비되면 이 숫자만 늘려주면 됨 */
const CONSTRUCTION_LVL = 12;
function isStageLocked(idx){ return idx >= CONSTRUCTION_LVL; }

/* 임의의 도감 만두(type)나 퓨즈 스킨(skin)을 받아 그게 속한 단계(STAGES 엔트리)를 찾아줌.
   type은 .stage(키)로, skin은 .stageIndex(숫자)로 단계를 갖고 있어서 둘 다 대응 */
function stageOf(item){
  if(!item) return null;
  if(item.stage) return STAGES.find(s=>s.key===item.stage) || null;
  if(typeof item.stageIndex==='number') return STAGES[item.stageIndex] || null;
  return null;
}
function imgFor(item){ if(item && item.customImg) return item.customImg; const s = stageOf(item); return s ? s.img : DUMPLING_IMG; }
function mascotFor(item){ if(item && item.customMascot) return item.customMascot; const s = stageOf(item); return s ? s.mascot : '만두'; }

    case 'shine': return 'radial-gradient(circle at 30% 25%, '+p.color+' 0 18%, transparent 40%)';
    default: return null;
  }
}

const FUSE_CUSTOM_NAME_POOL = ['모찌','폭신','토실','몰랑','포동','몽실','새콤','달콤','상큼','말랑'];
function randomFuseCustomName(){ return FUSE_CUSTOM_NAME_POOL[Math.floor(Math.random()*FUSE_CUSTOM_NAME_POOL.length)]; }
function buildFuseSkin(i, s){

   재활용해서 무한히 이어가도록 함. buildTypes에는 namedKey로 원래 단계 key를 전달해
   색깔/과일 단계의 이름-색상 매핑이 회차와 상관없이 항상 정확하게 유지되도록 함 */
function ensureStageBuilt(idx){
  while(STAGES.length<=idx){
    const newIndex = STAGES.length;
    const baseDef = STAGE_DEFS[newIndex % STAGE_DEFS.length];
    const loop = Math.floor(newIndex / STAGE_DEFS.length); // 0 = 원래 회차
    const def = loop===0 ? baseDef : Object.assign({}, baseDef, {
      key: baseDef.key+'-loop'+loop,
      namedKey: baseDef.key,
      title: baseDef.title+' '+(loop+1)+'회차'
    });
    const stageObj = {
      key: def.key,
      title: (newIndex+1)+'단계 · '+def.title,
      desc: def.desc,
      theme: def.theme, filter: def.filter,
      img: def.img || DUMPLING_IMG, mascot: def.mascot || '만두',
      types: buildTypes(def),
      shop:{ commonPrice:0, rarePrices:{}, legendaryPrices:{}, nextRefresh:0 },
      fuseReq:null
    };
    STAGES.push(stageObj);
    stageObj.types.forEach(t=> TYPE_MAP.set(t.id, t));
    FUSE_SKINS.push(buildFuseSkin(newIndex, stageObj));
  }
}

/* 코인/가격 표시 포맷: 1,000 미만은 그냥 정수로, 1,000 이상부터는 1000단위씩 끊어서
   소수점 둘째 자리까지 + 알파벳 단위(a=천, b=백만, c=십억, d=조, e=...)로 표기함.
   예) 999 → "999" / 1234 → "1.23a" / 1,000,000 → "1.00b" */
const FMT_UNIT_LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
function fmt(n){
  n = Math.round(n||0);
  if(n < 1000) return n.toLocaleString('ko-KR');
  let value = n, unitIdx = -1;
  while(value >= 1000 && unitIdx < FMT_UNIT_LETTERS.length-1){
    value /= 1000;
    unitIdx++;
  }
  return value.toFixed(2) + FMT_UNIT_LETTERS[unitIdx];
}

/* ================= CLICK BALANCE ================= */
/* 밸런스 규칙: "다음 단계의 일반 만두 수익은 반드시 이전 단계의 전설 만두 수익보다 높아야 한다."
   즉 일반→레어→전설로 갈수록 오르고(레어 3배, 전설 7배), 단계가 하나 넘어갈 때도
   또 한 번 확실히 올라야 함. 이걸 항상 만족시키려면 "단계 성장 배율(CLICK_STAGE_GROWTH)"이
   "등급 배율 중 가장 큰 값(legendary)"보다 커야 함 (9 > 7이므로 항상 성립).
   아래 stageEconomyFactor()가 이 값들을 그대로 참조해서 상점가/뽑기가도 자동으로 같이 맞춰짐 */
const RARITY_CLICK_MULT = {common:1, rare:3, legendary:7};
/* 단계가 늘어나도 별도 배열을 추가할 필요 없이 공식으로 자동 확장되는 클릭 수익 */
const CLICK_STAGE_GROWTH = 9;
function stageBaseClick(idx){ return Math.max(1, Math.round(1 * Math.pow(CLICK_STAGE_GROWTH, idx))); }

function stageIdxOf(type){ return STAGES.findIndex(s=>s.key===type.stage); }
function getEquippedType(){
  if(state.equippedId && state.dex.has(state.equippedId)) return TYPE_MAP.get(state.equippedId);
  return null;
}

  const eq = getEquippedType();

}

/* ================= FILTER / VISUAL HELPERS ================= */
/* 단계별 필터는 이제 STAGE_DEFS에 함께 정의되어 있어(각 테마의 질감을 표현),
   여기서는 그 값을 안전하게 읽어오기만 함. 정의된 단계를 넘어서면 마지막 느낌을
   재사용해서 이후 단계가 추가돼도 깨지지 않음 */
function stageFilterExtra(idx){
  if(idx<0) idx = 0;
  if(idx>=STAGES.length) idx = STAGES.length-1;
  return STAGES[idx].filter || '';
}
/* 현재 진행 단계의 테마 색상(2톤 그라디언트 + 배경톤)을 CSS 변수로 반영해서
   찜통/기둥/스테이지바가 단계마다 실제로 다른 색과 분위기를 갖도록 함 */
function applyStageTheme(idx){
  if(idx<0) idx = 0;
  if(idx>=STAGES.length) idx = STAGES.length-1;
  const t = STAGES[idx].theme;
  if(!t) return;
  const root = document.documentElement.style;
  root.setProperty('--stage-a', t.a);
  root.setProperty('--stage-b', t.b);
  root.setProperty('--stage-bg', t.bg);
}
/* 원본 말랑이 사진들은 전부 순백색이 아닌 살짝 회색빛 도는 흰 배경이라, multiply
   블렌딩만으로는 배경이 완전히 사라지지 않고 희미한 흰 테두리가 남는 경우가 있었음.
   그래서 아래 WHITE_CLEANUP만큼 밝기/대비를 한 번 더 올려서 배경을 순백에 더 가깝게
   밀어준 뒤 blend-photo(mix-blend-mode:multiply)에 넘김 → 배경이 훨씬 깔끔하게 사라짐 */
const WHITE_CLEANUP = ' contrast(1.08) brightness(1.05)';
/* 버터 원본 사진(BUTTER_IMG)은 만두/치즈 사진과 달리 포장 박스 자체가 흰색/크림색에
   가까워서, 다른 말랑이와 똑같은 강도로 밝기·대비를 계속 겹쳐 올리면(레어/전설로 갈수록,
   또 단계가 오를수록 더 세짐) 박스 본체까지 순백으로 날아가버림. multiply 블렌딩에서는
   순백 픽셀이 배경과 합쳐져 사실상 "투명"해지므로, 대비가 강해 끝까지 어둡게 남는
   인쇄 글씨/로고만 화면에 남는 것처럼 보였던 것임(5~6단계 공통 증상).
   그래서 버터 사진일 때만 밝기/대비 증가폭을 절반 이하로 눌러서 본체가 살아남게 함 */
function damp(mult, factor){ return 1 + (mult-1)*factor; }
function filterFor(type){
  const isButterImg = imgFor(type) === BUTTER_IMG;
  const cleanup = isButterImg ? ' contrast(1.03) brightness(1.015)' : WHITE_CLEANUP;
  if(type && type.customFilter) return type.customFilter+cleanup;
  let sat = type.rarity==='common' ? 2.1 : type.rarity==='rare' ? 2.7 : 3.2;
  let bri = type.rarity==='common' ? 1.02 : type.rarity==='rare' ? 1.08 : 1.14;
  let con = type.rarity==='common' ? 1.02 : 1.1;
  const idx = stageIdxOf(type);
  sat = sat * (1 + idx*0.04); // 단계가 오를수록 색이 조금씩 더 진해짐
  if(isButterImg){ bri = damp(bri, 0.35); con = damp(con, 0.35); }
  if(type.colorize){
    /* 원본 사진(만두/치즈)이 어떤 색이든 상관없이 이름이 가리키는 색이 실제로 보이도록,
       먼저 grayscale+sepia로 원본 색을 지우고 그 기준(세피아 색상각 ~30deg)에서
       원하는 색상각까지 회전시킴. 이렇게 해야 "빨강" 만두가 진짜 붉게, "파랑" 만두가
       진짜 푸르게 보임(기존에는 원본 사진 색 위에 단순 회전만 해서 이름과 실제 색이 어긋났음) */
    sat = sat * (type.colorSat!=null ? type.colorSat : 1);
    const colorBriMult = type.colorBri!=null ? (isButterImg ? damp(type.colorBri, 0.35) : type.colorBri) : 1;
    bri = bri * colorBriMult;
    const rot = type.hue - 30;
    return 'grayscale(1) sepia(1) hue-rotate('+rot+'deg) saturate('+sat.toFixed(2)+') brightness('+bri.toFixed(2)+') contrast('+con.toFixed(2)+')'+cleanup;
  }
  /* 단계별 질감 필터(stageFilterExtra)에도 자체 밝기/대비가 들어있어(특히 6단계 커스텀
     버터), 위의 완화값과 겹치면 다시 날아갈 수 있음. 버터 사진일 땐 세피아 톤(색감)만
     남기고 밝기/대비 성분은 빼서 겹침을 막음 */
  const extra = isButterImg ? stageFilterExtra(idx).replace(/contrast\([^)]*\)|brightness\([^)]*\)/g,'').trim() : stageFilterExtra(idx);
  const extraStr = extra ? ' '+extra : '';
  return 'hue-rotate('+type.hue+'deg) saturate('+sat.toFixed(2)+') brightness('+bri.toFixed(2)+') contrast('+con.toFixed(2)+')'+extraStr+cleanup;
}
/* 먹색/흑진주는 다른 만두들과 달리 항상 바깥 테두리가 사각으로 각져있음(도감/퓨즈 도감 등
   개수로 보여지는 모든 곳에 공통 적용되도록 thumbHtml 한 곳에서 처리) */
function isSquareShape(type){ return !!(type && (type.name==='먹색' || type.name==='흑진주')); }
function ringClassFor(type){
  let cls = type.rarity==='rare' ? 'ring rare' : type.rarity==='legendary' ? 'ring legendary' : '';
  if(isSquareShape(type)) cls = (cls ? cls : 'ring') + ' ring-square';
  return cls;
}
function thumbHtml(type, opts){
  opts = opts||{};
  const size = opts.size||56;
  const locked = opts.locked;
  const bg = opts.bg || 'var(--cream)';
  const filter = locked ? 'grayscale(1) brightness(0.5)' : filterFor(type);
  const inner = Math.round(size*0.82);
  const extraImgClass = locked ? '' : skinExtraImgClass(type);
  const fruitBg = locked ? null : fruitOverlayBg(type);
  const fruitOverlay = fruitBg ? '<span class="fruit-overlay" style="background:'+fruitBg+';"></span>' : '';
  const shapeRadius = (!locked && isSquareShape(type)) ? '10px' : '50%';
  return '<span class="thumb-circle" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:'+size+'px;height:'+size+'px;border-radius:'+shapeRadius+';background:'+bg+';overflow:hidden;">'+
    '<img src="'+imgFor(type)+'" class="blend-photo'+extraImgClass+'" style="width:'+inner+'px;height:'+inner+'px;object-fit:contain;filter:'+filter+';'+(locked?'':ghueStyleAttr(type))+'" alt="'+(locked?'???':type.name)+'">'+
    fruitOverlay+
  '</span>';
}

/* ================= AUDIO ================= */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended'){ actx.resume(); } if(actx) startBGM(); }
/* 설정 탭의 음소거/볼륨을 모든 효과음에 공통 반영. exponentialRampToValueAtTime은
   0을 목표값으로 쓸 수 없어서 무음이어도 아주 작은 값(0.0001)을 사용함 */
function soundGain(base){
  if(state.settings && state.settings.muted) return 0.0001;
  const vol = (state.settings && state.settings.volume!=null) ? state.settings.volume : 1;
  return Math.max(0.0001, base*vol);
}
/* ================= 배경음악(BGM) ================= */
/* 평온하고 잔잔한 패드 코드 진행을 계속 순환시켜 아주 작은 볼륨으로 깔아줌.
   Am7 → Fmaj7 → C → G 를 순서대로 도는 흔한 힐링/로파이풍 코드 진행이고, 각 코드는
   부드럽게 페이드 인/아웃되며 다음 코드와 살짝 겹쳐 이어져서 끊기는 느낌이 없음.
   음소거/볼륨 설정은 0.7초마다 마스터 게인에 다시 반영해서 재생 중에도 실시간으로 따라감 */
let bgmStarted = false;
let bgmMasterGain = null;
const BGM_BASE_LEVEL = 0.05; /* 작게 깔리는 배경음악이라 클릭 효과음보다 훨씬 낮은 기본 볼륨 */
const BGM_CHORDS = [
  [220.00, 261.63, 329.63, 392.00], /* Am7: A3 C4 E4 G4 */
  [174.61, 220.00, 261.63, 349.23], /* Fmaj7: F3 A3 C4 F4 */
  [130.81, 164.81, 196.00, 261.63], /* C: C3 E3 G3 C4 */
  [196.00, 246.94, 293.66, 392.00]  /* G: G3 B3 D4 G4 */
];
function startBGM(){
  if(bgmStarted || !actx) return;
  bgmStarted = true;
  bgmMasterGain = actx.createGain();
  bgmMasterGain.gain.value = soundGain(BGM_BASE_LEVEL);
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1500;
  bgmMasterGain.connect(lp).connect(actx.destination);
  let chordIdx = 0;
  const dur = 7.6; /* 코드 하나가 유지되는 시간(초) */
  function playNextChord(){
    if(!bgmStarted || !actx) return;
    const chord = BGM_CHORDS[chordIdx % BGM_CHORDS.length];
    chordIdx++;
    const t0 = actx.currentTime;
    chord.forEach((freq, i)=>{
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = actx.createGain();
      const peak = 0.22 - i*0.03;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0+2.6);
      g.gain.setValueAtTime(peak, t0+dur-2.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(g).connect(bgmMasterGain);
      osc.start(t0); osc.stop(t0+dur+0.15);
    });
    setTimeout(playNextChord, (dur-1.2)*1000); /* 다음 코드와 살짝 겹치게 예약 */
  }
  playNextChord();
}

/* ================= 효과음 에코 버스 ================= */
/* 에코는 모든 말랑이가 아니라, 2n단계 퓨즈 보상인 "은하계" 스킨을 장착 중일 때만
   적용됨. 그 외에는 기존처럼 원음 그대로(actx.destination) 재생함 */
let echoBus = null;
function getEchoBus(){
  if(!actx) return null;
  if(echoBus) return echoBus;
  const bus = actx.createGain();
  bus.gain.value = 1;
  const delay = actx.createDelay(1.0);
  delay.delayTime.value = 0.32;       /* 증폭: 잔향 간격을 더 넓게(0.22 → 0.32) */
  const feedback = actx.createGain();
  feedback.gain.value = 0.5;          /* 증폭: 반복 잔향이 더 오래 남도록(0.3 → 0.5) */
  const echoLp = actx.createBiquadFilter();
  echoLp.type = 'lowpass';
  echoLp.frequency.value = 2600;
  const wet = actx.createGain();
  wet.gain.value = 0.55;              /* 증폭: 잔향 성분 볼륨 강화(0.32 → 0.55) */
  bus.connect(actx.destination);       // 원음 그대로
  bus.connect(delay);
  delay.connect(echoLp);
  echoLp.connect(feedback);
  feedback.connect(delay);             // 피드백 루프(반복되며 서서히 잦아듦)
  echoLp.connect(wet);
  wet.connect(actx.destination);       // 에코(잔향) 성분
  echoBus = bus;
  return bus;
}
/* 현재 장착 중인 스킨이 은하계(galaxy) 스킨일 때만 에코 버스를, 그 외에는 일반 출력을 씀 */
function currentSoundBus(){
  const skin = getEquippedSkin();
  if(skin && skin.style==='galaxy') return getEchoBus() || actx.destination;
  return actx.destination;
}
function playPop(pitch, mascot){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  if(mascot==='치즈'){ playCheeseSquish(pitch); return; }
  if(mascot==='버터'){ playButterSquish(pitch); return; }
  if(mascot==='키캡'){ playKeycapClack(pitch); return; }
  if(mascot==='카피바라'){ playCapybaraHum(pitch); return; }
  if(mascot==='발바닥'){ playPawPad(pitch); return; }
  if(mascot==='아이스크림'){ playIcecreamSwirl(pitch); return; }
  const t0=actx.currentTime;
  const osc=actx.createOscillator(); const gain=actx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(240*pitch, t0);
  osc.frequency.exponentialRampToValueAtTime(480*pitch, t0+0.08);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(soundGain(0.28), t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
  osc.connect(gain).connect(currentSoundBus());
  osc.start(t0); osc.stop(t0+0.22);
}
/* 치즈 말랑이 전용 클릭음: 버터의 매끄러운 사인파 멜팅음과 겹치지 않도록, 노이즈를
   대역통과 필터로 걸러 만든 '샤아악' 쉬익 소리(고음→저음으로 쓸려 내려가는 스침음)에
   '사르르' 늘어나는 낮은 글리산도 톤을 겹쳐서, 치즈가 쭉 늘어나며 갈라지는 질감을 냄 */
function playButterSquish(pitch){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  const t0=actx.currentTime;
  const dur = 0.4;
  const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(3400*pitch, t0);
  bp.frequency.exponentialRampToValueAtTime(850*pitch, t0+dur);
  const noiseGain = actx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, t0);
  noiseGain.gain.exponentialRampToValueAtTime(soundGain(0.24), t0+0.05);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  noise.connect(bp).connect(noiseGain).connect(currentSoundBus());
  noise.start(t0); noise.stop(t0+dur);

  const osc = actx.createOscillator();
  const oscGain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180*pitch, t0);
  osc.frequency.linearRampToValueAtTime(105*pitch, t0+0.28);
  oscGain.gain.setValueAtTime(0.0001, t0);
  oscGain.gain.exponentialRampToValueAtTime(soundGain(0.18), t0+0.04);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
  osc.connect(oscGain).connect(currentSoundBus());
  osc.start(t0); osc.stop(t0+0.34);
}
/* 버터 말랑이 전용 클릭음: 치즈의 출렁이는 물결과 달리, 사인파 + 로우패스 필터가
   부드럽게 하강하며 '사르르 녹는' 느낌을 냄. 통통 튀지 않고 한 번에 매끄럽게 미끄러짐 */
function playCheeseSquish(pitch){

/* 키캡 스킨 전용 클릭음: 다른 스킨들의 부드러운 '말랑' 소리와 달리, 기계식 키보드
   스위치를 연달아 두드리는 '타다닥' 3연타 타건음을 냄. 각 타건은 짧은 대역통과
   노이즈(딸깍 성분)와 저역 트라이앵글 톤(몸통 울림)을 겹쳐서 만들고, 타건마다
   시작 시각을 살짝 어긋나게 배치해 실제 연타처럼 들리게 함 */
function playKeycapClack(pitch){
  pitch = pitch||1;
  ensureAudio(); if(!actx) return;
  const t0 = actx.currentTime;
  const hits = [0, 0.05, 0.095]; // 타 - 다 - 닥
  hits.forEach((offset, idx)=>{
    const t = t0 + offset;
    const dur = 0.05;
    const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = actx.createBufferSource();
    noise.buffer = buffer;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 2.4;
    bp.frequency.setValueAtTime((2700 + idx*260)*pitch, t);
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(soundGain(idx===0 ? 0.32 : 0.24), t+0.004);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    noise.connect(bp).connect(ng).connect(currentSoundBus());
    noise.start(t); noise.stop(t+dur);

    const osc = actx.createOscillator();
    const og = actx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160*pitch, t);
    osc.frequency.exponentialRampToValueAtTime(95*pitch, t+0.05);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(soundGain(0.14), t+0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
    osc.connect(og).connect(currentSoundBus());
    osc.start(t); osc.stop(t+0.07);
  });
}
/* 카피바라 말랑이 전용 클릭음: 온천에 몸을 담근 카피바라의 나른한 '음냐~' 낮은 허밍.
   삼각파를 아주 완만하게 오르내리며(비브라토) 낮은 음역대에서 부드럽게 울리게 해서
   다른 스킨들의 통통 튀는 소리와 달리 늘어지고 여유로운 느낌을 냄 */

/* 발바닥 말랑이 전용 클릭음: 푹신한 젤리 발바닥을 꾹 누르는 듯한 짧고 뭉툭한 '톡' 소리.

/* ================= STAGE RUNTIME INIT ================= */
function sampleIds(types, min, max){
  const n = randInt(min, Math.min(max, types.length));
  const shuffled = types.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0,n).map(t=>t.id);
}
function refreshFuseReq(stage){
  const commons = stage.types.filter(t=>t.rarity==='common');
  const rares = stage.types.filter(t=>t.rarity==='rare');
  const legends = stage.types.filter(t=>t.rarity==='legendary');
  stage.fuseReq = {
    commons: commons.map(t=>t.id),
    rares: sampleIds(rares,4,7),
    legendaries: sampleIds(legends,2,3)
  };
  stage.fuseNextRefresh = Date.now()+60000;
}
function initStageRuntime(idx){
  const stage = STAGES[idx];
  refreshFuseReq(stage);
  stage.shop.commonPrice = Math.round(25 * stageEconomyFactor(idx));
  refreshShopPrices(stage);
}
function refreshShopPrices(stage){
  const idx = STAGES.indexOf(stage);
  const scale = stageEconomyFactor(idx);
  stage.shop.rarePrices = {};
  stage.shop.legendaryPrices = {};
  stage.types.filter(t=>t.rarity==='rare').forEach(t=>{
    stage.shop.rarePrices[t.id] = randInt(Math.round(150*scale), Math.round(300*scale));
  });
  stage.types.filter(t=>t.rarity==='legendary').forEach(t=>{
    stage.shop.legendaryPrices[t.id] = randInt(Math.round(900*scale), Math.round(1600*scale));
  });
  stage.shop.nextRefresh = Date.now()+60000;
}
function getPrice(type){
  const stage = STAGES.find(s=>s.key===type.stage);
  if(type.rarity==='common') return stage.shop.commonPrice;
  if(type.rarity==='rare') return stage.shop.rarePrices[type.id];
  return stage.shop.legendaryPrices[type.id];
}

/* 다음 단계로 넘어갈 때는 '그 전 단계의 전설 만두'를 장착해서 버는 수익이
   플레이어의 실제 수입이라고 가정하고, 그 수입 기준으로 가격을 잡음.
   (1단계 초반은 아직 전설 만두가 없으므로 기본 클릭값 1을 기준으로 함)
   나중에 단계를 몇 개 더 추가해도 이 공식이 자동으로 대응함 */
function stageEconomyFactor(idx){
  if(idx<=0) return stageBaseClick(0); // 1단계 초반: 기본 클릭값 기준
  return stageBaseClick(idx-1) * RARITY_CLICK_MULT.legendary; // 그 이후: 전 단계 전설 만두 클릭값 기준
}

/* 뽑기 탭에서는 카테고리(단계)를 따로 선택할 수 있으므로, 뽑기 비용/확률은
   진행 단계(state.stageIndex)가 아니라 사용자가 선택한 뽑기 단계(state.gachaStageView)를
   기준으로 계산함. 단, 퓨즈 비용은 항상 진행 중인 단계 기준 그대로 유지 */
function gachaStage(){ return STAGES[state.gachaStageView]; }
function normalGachaCost(){ return Math.round(40 * stageEconomyFactor(state.gachaStageView)); }
function rareGachaCost(){ return Math.round(150 * stageEconomyFactor(state.gachaStageView)); }
function legendaryGachaCost(){ return Math.round(650 * stageEconomyFactor(state.gachaStageView)); }

/* 전설 뽑기 실패(대체 코인) 보상도 전설 뽑기 비용에 비례하게 만들어서
   단계가 올라가도 보상이 상대적으로 초라해지지 않도록 함 */
function legendaryCoinBonus(){ return Math.round(legendaryGachaCost()*0.55); }
function normalGacha10Cost(){ return normalGachaCost()*10; }
function rareGacha10Cost(){ return rareGachaCost()*10; }
function legendaryGacha10Cost(){ return legendaryGachaCost()*10; }

function rollRarity(table){
  const r = Math.random()*100; let acc=0;
  for(const k in table){ acc+=table[k]; if(r<acc) return k; }
  const keys = Object.keys(table); return keys[keys.length-1];
}
/* 마일리지는 이제 카테고리(단계)별로 따로 쌓임. 새 단계가 해금되면 자동으로 0부터 시작함 */
function getMileage(stageKey){
  if(!state.mileage[stageKey]) state.mileage[stageKey] = {common:0, rare:0, legendary:0};
  return state.mileage[stageKey];
}
function addMileage(stageKey, rarity, amt){
  const m = getMileage(stageKey);
  m[rarity] = (m[rarity]||0) + amt;
}
/* 중복 만두가 나오면 등급별 마일리지로 적립됨(카테고리별 독립).
   단, 이미 퓨즈를 완료한 '지난 단계'의 만두는 앞으로 상점 가격 기준이 될 예정이라
   중복이어도 도감 보유 개수가 함께 계속 쌓임. 현재 해금 최상위 단계는 지금처럼
   마일리지만 쌓이고 보유 개수는 늘지 않음(1개 유지) */
function grantType(type){
  const owned = state.inventory[type.id]||0;
  const isNewDiscovery = !state.dex.has(type.id);
  state.dex.add(type.id);
  const isPastStage = stageIdxOf(type) < state.stageIndex;
  if(owned<=0){
    state.inventory[type.id] = 1;
    return { isNew:isNewDiscovery, restocked: !isNewDiscovery, mileage:0 };
  }
  addMileage(type.stage, type.rarity, 1);
  if(isPastStage) state.inventory[type.id] = Math.min(99, owned+1); /* 도감 보유 개수(스택)는 99개까지만 */
  return { isNew:false, restocked:false, mileage:1, stacked:isPastStage };
}
/* ---- 뽑기 1회분 로직: 단일 뽑기와 10연 뽑기가 동일하게 재사용 ---- */
function rollNormalOnce(){
  const stage = gachaStage();
  const rarity = rollRarity({common:85, rare:15});
  const pool = stage.types.filter(t=>t.rarity===rarity);
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}
function rollRareOnce(){
  const stage = gachaStage();
  const rarity = rollRarity({rare:85, legendary:15});
  const pool = stage.types.filter(t=>t.rarity===rarity);
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}
function rollLegendaryOnce(){
  const stage = gachaStage();
  if(Math.random() < 0.5){
    const amount = legendaryCoinBonus();
    state.coins += amount;
    return { coinsOnly:true, amount };
  }
  const pool = stage.types.filter(t=>t.rarity==='legendary');
  const picked = pool[randInt(0,pool.length-1)];
  return { type:picked, result:grantType(picked) };
}

/* ---- 10연 뽑기: 가격과 소모량을 10배로 한 번에 처리하고 결과를 모아서 보여줌 ---- */
function finishGacha10(rolls){
  const order = {common:0, rare:1, legendary:2};
  let best = 'common';
  rolls.forEach(r=>{ if(r.type && order[r.type.rarity]>order[best]) best = r.type.rarity; });
  playChime(best);
  showReveal10(rolls);
  renderAll();
}

  if(state.coins < cost){ toast('코인이 부족합니다 (10연 '+fmt(cost)+')'); return; }
  state.coins -= cost;
  const rolls = [];
  for(let i=0;i<10;i++) rolls.push(rollNormalOnce());

}

/* ---- 뽑기권 제작: 현재 뽑기 탭에서 선택 중인 카테고리의 마일리지를 소비 ---- */
const RARE_TICKET_COST = 10;   // 일반 마일리지
const LEGEND_TICKET_COST = 5;  // 레어 마일리지
/* 전설 마일리지는 그동안 쌓이기만 하고 쓸 곳이 없었음. 이제 전설 마일리지 1개를
   레어 마일리지 3개로 전환할 수 있음 */
const LEGEND_MILEAGE_FILL_AMOUNT = 3;
function fillRareFromLegendary(){
  const m = getMileage(gachaStage().key);
  if(m.legendary < 1){ toast('전설 마일리지가 부족합니다'); return; }
  m.legendary -= 1;
  m.rare += LEGEND_MILEAGE_FILL_AMOUNT;
  playChime('legendary');
  toast('전설 마일리지로 레어 마일리지 +'+LEGEND_MILEAGE_FILL_AMOUNT);
  renderAll();
}
function craftRareTicket(){
  const m = getMileage(gachaStage().key);
  if(m.common < RARE_TICKET_COST){ toast('일반 마일리지가 부족합니다'); return; }
  m.common -= RARE_TICKET_COST;
  state.ticketsRare += 1;
  playChime('rare');
  toast('레어 뽑기권을 획득했습니다');
  renderAll();
}
function craftLegendaryTicket(){
  const m = getMileage(gachaStage().key);
  if(m.rare < LEGEND_TICKET_COST){ toast('레어 마일리지가 부족합니다'); return; }
  m.rare -= LEGEND_TICKET_COST;
  state.ticketsLegendary += 1;
  playChime('legendary');
  toast('전설 뽑기권을 획득했습니다');
  renderAll();
}
function buyItem(typeId){
  const type = TYPE_MAP.get(typeId);
  const price = getPrice(type);
  if(state.coins < price){ toast('코인이 부족합니다'); return; }
  state.coins -= price;
  state.inventory[typeId] = (state.inventory[typeId]||0)+1;
  state.dex.add(typeId);
  playPop(1.15, mascotFor(type));
  toast(type.name+' '+mascotFor(type)+'를 구매했습니다');
  renderAll();
}
function attemptFuse(){
  const stage = currentStage();
  const nextIdx = state.stageIndex+1;
  if(isStageLocked(nextIdx)){ toast((nextIdx+1)+'단계는 아직 공사중입니다. 조금만 기다려주세요!'); return; }
  const req = stage.fuseReq;
  const all = req.commons.concat(req.rares, req.legendaries);
  const missing = all.filter(id => (state.inventory[id]||0) < 1);
  if(missing.length>0){ toast('재료가 '+missing.length+'개 부족합니다'); return; }
  const cost = fuseCoinCost();
  if(state.coins < cost){ toast('코인이 부족합니다 (필요 '+fmt(cost)+')'); return; }
  state.coins -= cost;
  all.forEach(id => state.inventory[id] -= 1);
  playChime('legendary');
  advanceStage();
}
function advanceStage(){
  const finished = currentStage();
  const nextIdx = state.stageIndex+1;
  ensureStageBuilt(nextIdx); /* 앞으로 퓨즈는 끝나지 않고 계속 이어짐 */
  initStageRuntime(nextIdx);
  showStageClear(finished, STAGES[nextIdx]);
  state.stageIndex = nextIdx;
  state.activeTab = 'gacha';
  state.dexStageView = nextIdx;
  /* 퓨즈에 성공하면 뽑기 햄버거 메뉴(gachaStageView)도 방금 새로 열린 다음 단계
     카테고리로 자동 전환함 */
  state.gachaStageView = nextIdx;
  renderAll();
}

  '꺄앙! 놀랐잖아~', '히히, 간지러워!', '또 눌러줘~', '말랑말랑 반응 완료!', '튕겨져 나갈 뻔했어!'
];
const PLAYGROUND_GIFT_LINE = '🎁 선물이 도착했어요! 눌러보세요';
const PLAYGROUND_GIFT_THANKS = '고마워! 다음에 또 줄게~';
const playgroundTimers = {}; /* {slotIdx:{idle,gift,tapReset,wander,arrive,resumeWander}} */

/* 놀이터 가구 상점 목록: 각각 최대 보유 개수가 정해져 있고, 놓인 가구를 누르면
   가장 먼저 배치된 말랑이가 그 가구 앞으로 걸어가 전용 대사를 보여줌(상호작용).
   가격은 코인이 아니라 보석(gems) 단위이며, 모든 가구가 보석 1개로 통일되어 있음 */
const FURNITURE_DEFS = [
  {type:'chair', name:'대나무 의자', emoji:'🪑', price:1, maxOwned:4, desc:'앉아서 쉬어요', useLine:'의자에 앉아 쉬어요~ 편안해'},
  {type:'desk',  name:'작은 책상',   emoji:'🖥️', price:1, maxOwned:3, desc:'공부/작업 중', useLine:'책상 앞에서 집중 중!'},
  {type:'bed',   name:'포근한 침대', emoji:'🛏️', price:1, maxOwned:2, desc:'낮잠을 자요',  useLine:'침대에서 낮잠 자요… zzz'},
  {type:'plant', name:'화분',       emoji:'🪴', price:1, maxOwned:5, desc:'놀이터 장식',   useLine:'화분 냄새가 좋다~'},
  {type:'lamp',  name:'조명',       emoji:'💡', price:1, maxOwned:4, desc:'놀이터 장식',   useLine:'조명이 아늑해요~'},
  {type:'teddy', name:'곰인형',     emoji:'🧸', price:1, maxOwned:4, desc:'같이 놀아요',   useLine:'인형이랑 놀아요! 폭신폭신~'}
];
function furnitureDef(type){ return FURNITURE_DEFS.find(f=>f.type===type); }

function pgRandIdle(){ return PLAYGROUND_IDLE_LINES[randInt(0,PLAYGROUND_IDLE_LINES.length-1)]; }
/* 슬롯에 걸려있는 타이머는 이름이 계속 늘어나므로(idle/gift/tapReset/wander/arrive/resumeWander)
   개별 나열 대신 있는 타이머를 전부 지우는 방식으로 통일함 */
function clearPlaygroundTimers(slotIdx){
  const t = playgroundTimers[slotIdx];
  if(t){ Object.keys(t).forEach(k=> clearTimeout(t[k])); }
  playgroundTimers[slotIdx] = {};
}
function setBubbleText(slotIdx, text){
  const slot = state.playground.pets[slotIdx];
  if(!slot) return;
  slot.bubbleText = text;
  const el = document.querySelector('[data-bubble="'+slotIdx+'"]');
  if(el) el.textContent = text;
}
/* 2분~2분30초(120000~150000ms)마다 선물 말풍선 등장. keycap/mandu 스킨 보유 시
   보유 개수만큼 1초씩 단축(중복 합산)되며, 최소 10초는 보장함 */
function scheduleGift(slotIdx){
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.gift);
  const speedup = playgroundGiftSpeedupMs();
  const lo = Math.max(10000, 120000-speedup);
  const hi = Math.max(lo+1000, 150000-speedup);
  t.gift = setTimeout(()=>{
    const slot = state.playground.pets[slotIdx];
    if(!slot) return;
    slot.giftReady = true;
    setBubbleText(slotIdx, PLAYGROUND_GIFT_LINE);
    const el = document.querySelector('[data-bubble="'+slotIdx+'"]');
    if(el) el.classList.add('gift');
    playChime('rare');
  }, randInt(lo, hi));
}
/* 4~7.5초마다 평상시 대사 20종 중 하나를 랜덤 표시 */
function scheduleIdle(slotIdx){
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.idle);
  t.idle = setTimeout(()=>{
    const slot = state.playground.pets[slotIdx];
    if(!slot){ return; }
    if(!slot.giftReady) setBubbleText(slotIdx, pgRandIdle());
    scheduleIdle(slotIdx);
  }, randInt(4000, 7500));
}
/* ---- 자유 보행: 놀이터 안을 이동할 수 있는 영역(퍼센트 좌표) ---- */
function pgStageBounds(){ return {xMin:8, xMax:90, yMin:50, yMax:86}; }
/* 목표 좌표로 부드럽게 이동시키고(거리 비례 시간), 도착하면 onArrive 콜백 실행.
   실제 DOM은 놀이터 탭이 보이고 있을 때만 존재하므로, 탭을 벗어나 있어도
   상태(xPct/yPct)만은 계속 갱신되어 다시 돌아오면 마지막 위치부터 자연스럽게 이어짐 */
function movePetTo(slotIdx, nx, ny, onArrive){
  const slot = state.playground.pets[slotIdx];
  if(!slot) return;
  const ox = slot.xPct!=null ? slot.xPct : 50;
  const oy = slot.yPct!=null ? slot.yPct : 70;
  const dist = Math.hypot(nx-ox, ny-oy);
  const dur = Math.min(3.2, Math.max(0.5, dist/22));
  if(nx < ox-1) slot.facing = -1; else if(nx > ox+1) slot.facing = 1;
  slot.xPct = nx; slot.yPct = ny;
  const el = document.querySelector('[data-tappet="'+slotIdx+'"]');
  if(el){
    el.style.transition = 'left '+dur.toFixed(2)+'s linear, top '+dur.toFixed(2)+'s linear';
    el.style.left = nx+'%';
    el.style.top = ny+'%';
    el.classList.add('walking');
    const imgWrap = el.querySelector('.pg-pet-img-wrap');
    if(imgWrap) imgWrap.style.transform = 'scaleX('+(slot.facing||1)+')';
  }
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.arrive);
  t.arrive = setTimeout(()=>{
    const elNow = document.querySelector('[data-tappet="'+slotIdx+'"]');
    if(elNow) elNow.classList.remove('walking');
    if(onArrive) onArrive();
  }, dur*1000);
}
/* 1.8~4.2초마다 놀이터 안 임의의 지점으로 자유롭게 걸어다님 */
function stepWander(slotIdx){
  const slot = state.playground.pets[slotIdx];
  if(!slot) return;
  const b = pgStageBounds();
  movePetTo(slotIdx, randInt(b.xMin,b.xMax), randInt(b.yMin,b.yMax), ()=> scheduleWander(slotIdx));
}
function scheduleWander(slotIdx){
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.wander);
  t.wander = setTimeout(()=> stepWander(slotIdx), randInt(1800,4200));
}
function assignPet(slotIdx, typeId){
  const b = pgStageBounds();
  state.playground.pets[slotIdx] = {
    typeId, giftReady:false, bubbleText:pgRandIdle(),
    xPct: randInt(b.xMin,b.xMax), yPct: randInt(b.yMin,b.yMax), facing:1
  };
  clearPlaygroundTimers(slotIdx);
  scheduleIdle(slotIdx);
  scheduleGift(slotIdx);
  scheduleWander(slotIdx);
  renderPanel();
}
function removePet(slotIdx){
  clearPlaygroundTimers(slotIdx);
  state.playground.pets[slotIdx] = null;
  if(pgIsGrabbed('pet', slotIdx)) state.pgGrabbed = null;
  renderPanel();
}
/* 선물 마일리지: 현재 해금한 최상위 단계(진행 중인 단계) 기준, 일반 95% / 레어 5% / 전설 없음 */
function claimPlaygroundGift(slotIdx){
  const slot = state.playground.pets[slotIdx];
  if(!slot || !slot.giftReady) return;
  slot.giftReady = false;
  const stage = currentStage();
  const isRare = Math.random() < 0.15;
  const rarity = isRare ? 'rare' : 'common';
  const amount = isRare ? 1 : 2;
  addMileage(stage.key, rarity, amount);
  playChime(rarity);
  toast('선물 도착! '+stage.title.split('·')[1].trim()+' '+RARITY_LABEL[rarity]+' 마일리지 +'+amount);
  const el = document.querySelector('[data-bubble="'+slotIdx+'"]');
  if(el) el.classList.remove('gift');
  setBubbleText(slotIdx, PLAYGROUND_GIFT_THANKS);
  scheduleGift(slotIdx);
  if(state.activeTab==='gacha') renderPanel(); /* 마일리지 보드가 보이는 중이면 새로고침 */
}
function onPetBubbleClick(slotIdx){
  const slot = state.playground.pets[slotIdx];
  if(!slot) return;
  ensureAudio();
  if(slot.giftReady){ claimPlaygroundGift(slotIdx); return; }
  const type = TYPE_MAP.get(slot.typeId);
  playPop(1.05, type ? mascotFor(type) : undefined);
  setBubbleText(slotIdx, PLAYGROUND_TAP_LINES[randInt(0,PLAYGROUND_TAP_LINES.length-1)]);
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.tapReset);
  t.tapReset = setTimeout(()=>{
    const s = state.playground.pets[slotIdx];
    if(s && !s.giftReady) setBubbleText(slotIdx, pgRandIdle());
  }, 2200);
}
function closePlaygroundPick(){ document.getElementById('playgroundPickOverlay').classList.remove('show'); }
/* 놀이터 펫은 도감에 등록된 말랑이(도감 만두)만 선택 가능 - 퓨즈 스킨/일반 스킨은 제외 */
function openPlaygroundPick(slotIdx){
  state.playgroundPickSlot = slotIdx;
  const grid = document.getElementById('playgroundPickGrid');
  const owned = Array.from(state.dex).map(id=>TYPE_MAP.get(id)).filter(Boolean);
  if(owned.length===0){
    grid.innerHTML = '<div class="fusedex-empty" style="grid-column:1/-1;">아직 도감에 등록된 말랑이가 없어요.<br>뽑기로 먼저 말랑이를 모아보세요!</div>';
  } else {
    grid.innerHTML = owned.map(type=>{
      const ringClass = ringClassFor(type);
      return '<div class="dex-item" data-pickpet="'+type.id+'" style="cursor:pointer;">'+
        '<div class="dex-thumb-wrap">'+(ringClass?'<div class="'+ringClass+'"></div>':'')+thumbHtml(type,{size:56})+'</div>'+
        '<div class="dex-name">'+type.name+'</div>'+
        '<div class="dex-rarity '+type.rarity+'">'+RARITY_LABEL[type.rarity]+'</div>'+
      '</div>';
    }).join('');
    grid.querySelectorAll('[data-pickpet]').forEach(el=>{
      el.onclick = ()=>{ ensureAudio(); assignPet(state.playgroundPickSlot, el.dataset.pickpet); closePlaygroundPick(); };
    });
  }
  document.getElementById('playgroundPickOverlay').classList.add('show');
}
document.getElementById('playgroundPickClose').onclick = closePlaygroundPick;

/* ---- 놀이터 가구 상점 ---- */
function closePlaygroundShop(){ document.getElementById('playgroundShopOverlay').classList.remove('show'); }
function openPlaygroundShop(){
  renderPlaygroundShopGrid();
  document.getElementById('playgroundShopOverlay').classList.add('show');
}
function renderPlaygroundShopGrid(){
  const grid = document.getElementById('playgroundShopGrid');
  if(!grid) return;
  const furniture = state.playground.furniture || [];
  grid.innerHTML = FURNITURE_DEFS.map(def=>{
    const owned = furniture.filter(f=>f.type===def.type).length;
    const maxed = owned>=def.maxOwned;
    const afford = state.gems>=def.price;
    const btnLabel = maxed
      ? '가득 참'
      : ICONS.gem.replace('width="18" height="18"','width="12" height="12"')+' '+fmt(def.price);
    return '<div class="pg-shop-item">'+
      '<div class="pg-shop-emoji">'+def.emoji+'</div>'+
      '<div class="pg-shop-name">'+def.name+'</div>'+
      '<div class="pg-shop-desc">'+def.desc+'</div>'+
      '<div class="pg-shop-count">보유 '+owned+' / '+def.maxOwned+'</div>'+
      '<button class="btn '+(maxed?'btn-outline':'btn-primary')+'" data-buyfurniture="'+def.type+'" '+((maxed||!afford)?'disabled':'')+'>'+btnLabel+'</button>'+
    '</div>';
  }).join('');
  grid.querySelectorAll('[data-buyfurniture]').forEach(btn=>{
    btn.onclick = ()=>{ ensureAudio(); buyFurniture(btn.dataset.buyfurniture); };
  });
}
document.getElementById('playgroundShopClose').onclick = closePlaygroundShop;
function buyFurniture(type){
  const def = furnitureDef(type);
  if(!def) return;
  if(!state.playground.furniture) state.playground.furniture = [];
  const owned = state.playground.furniture.filter(f=>f.type===type).length;
  if(owned>=def.maxOwned){ toast('더 이상 놓을 수 없어요 (최대 '+def.maxOwned+'개)'); return; }
  if(state.gems < def.price){ toast('보석이 부족해요'); return; }
  state.gems -= def.price;
  const b = pgStageBounds();
  state.playground.furniture.push({
    id: type+'-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    type, xPct: randInt(b.xMin,b.xMax), yPct: randInt(58,88)
  });
  playChime('common');
  toast(def.name+' 구매 완료! 놀이터에 놓았어요');
  renderHeader();
  renderPlaygroundShopGrid();
  if(state.activeTab==='playground') renderPanel();
}
function removeFurniture(instId){
  const list = state.playground.furniture || [];
  const idx = list.findIndex(f=>f.id===instId);
  if(idx<0) return;
  const inst = list[idx];
  const def = furnitureDef(inst.type);
  const refund = def ? Math.round(def.price*0.5) : 0;
  list.splice(idx,1);
  state.gems += refund;
  if(pgIsGrabbed('furniture', instId)) state.pgGrabbed = null;
  toast((def?def.name:'가구')+' 정리 완료 · +'+fmt(refund)+' 보석');
  renderHeader();
  renderPlaygroundShopGrid();
  renderPanel();
}
/* 가구를 누르면 놀이터에 놓인 첫 번째 말랑이가 그 가구 앞으로 걸어가 전용 대사를 보여줌 */
function onFurnitureClick(instId){
  const inst = (state.playground.furniture||[]).find(f=>f.id===instId);
  if(!inst) return;
  const def = furnitureDef(inst.type);
  ensureAudio();
  const slotIdx = state.playground.pets.findIndex(p=>p);
  if(slotIdx<0){
    toast(def ? def.name+' · '+def.desc : '가구를 눌렀어요');
    return;
  }
  const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
  clearTimeout(t.wander); clearTimeout(t.arrive); clearTimeout(t.resumeWander);
  const busyMs = 3600;
  movePetTo(slotIdx, inst.xPct, Math.min(88, inst.yPct+3), ()=>{
    setBubbleText(slotIdx, def ? def.useLine : '여기서 놀아요~');
    playPop(1.05);
  });
  t.resumeWander = setTimeout(()=> scheduleWander(slotIdx), busyMs);
}
/* ---- 편집 모드: 말랑이/가구를 탭(클릭)해서 잡고, 놓을 위치를 다시 탭해서 옮김 ---- */
/* 클릭/탭 좌표를 놀이터 무대(#pgStage) 기준 퍼센트 좌표로 변환 */
function pgClickToStageXY(e){
  const stage = document.getElementById('pgStage');
  if(!stage) return {xPct:50, yPct:70};
  const rect = stage.getBoundingClientRect();
  const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  return {
    xPct: ((cx-rect.left)/rect.width)*100,
    yPct: ((cy-rect.top)/rect.height)*100
  };
}
function pgIsGrabbed(type, id){
  return !!(state.pgGrabbed && state.pgGrabbed.type===type && String(state.pgGrabbed.id)===String(id));
}
/* 편집 모드에서 말랑이/가구를 탭하면 잡고(다시 탭하면 취소), 잡은 채로 무대의 다른 곳을 탭하면 그 자리로 옮김 */
function pgGrabItem(type, id){
  if(pgIsGrabbed(type, id)){ state.pgGrabbed = null; renderPanel(); return; }
  state.pgGrabbed = {type, id};
  renderPanel();
  toast(type==='pet' ? '말랑이를 놓을 위치를 탭하세요' : '가구를 놓을 위치를 탭하세요');
}
function pgPlaceGrabbed(xPct, yPct){
  const g = state.pgGrabbed;
  if(!g) return;
  if(g.type==='pet'){
    const slotIdx = parseInt(g.id,10);
    const slot = state.playground.pets[slotIdx];
    if(slot){
      const b = pgStageBounds();
      const nx = Math.min(b.xMax, Math.max(b.xMin, xPct));
      const ny = Math.min(b.yMax, Math.max(b.yMin, yPct));
      const t = playgroundTimers[slotIdx] || (playgroundTimers[slotIdx]={});
      clearTimeout(t.wander); clearTimeout(t.arrive); clearTimeout(t.resumeWander);
      movePetTo(slotIdx, nx, ny, ()=> scheduleWander(slotIdx));
    }
  } else if(g.type==='furniture'){
    const inst = (state.playground.furniture||[]).find(f=>f.id===g.id);
    if(inst){
      inst.xPct = Math.min(92, Math.max(6, xPct));
      inst.yPct = Math.min(92, Math.max(40, yPct));
    }
  }
  state.pgGrabbed = null;
  renderPanel();
}
/* 말풍선이 화면(무대) 밖으로 삐져나가지 않도록 위치를 보정함(모바일 좁은 화면 대응) */
function clampPlaygroundBubbles(){
  const stage = document.getElementById('pgStage');
  if(!stage) return;
  const stageRect = stage.getBoundingClientRect();
  if(!stageRect.width) return;
  const margin = 6;
  document.querySelectorAll('.pg-pet-bubble').forEach(b=>{
    b.style.transform = 'translateX(-50%)';
    const r = b.getBoundingClientRect();
    let shift = 0;
    if(r.left < stageRect.left+margin) shift = (stageRect.left+margin)-r.left;
    else if(r.right > stageRect.right-margin) shift = (stageRect.right-margin)-r.right;
    if(shift) b.style.transform = 'translateX(calc(-50% + '+shift.toFixed(1)+'px))';
  });
}
/* 저장/불러오기 이후 등, 상태만 있고 타이머가 없는 슬롯들을 다시 스케줄함 */
function reschedulePlaygroundTimers(){
  Object.keys(playgroundTimers).forEach(k=> clearPlaygroundTimers(k));
  if(!state.playground.furniture) state.playground.furniture = [];
  ensurePlaygroundSlots();
  const b = pgStageBounds();
  (state.playground.pets||[]).forEach((slot,i)=>{
    if(slot){
      if(slot.xPct==null){ slot.xPct = randInt(b.xMin,b.xMax); slot.yPct = randInt(b.yMin,b.yMax); slot.facing = 1; }
      scheduleIdle(i); scheduleGift(i); scheduleWander(i);
    }
  });
}

function renderPlaygroundPanel(){
  const pg = state.playground;
  if(!pg.furniture) pg.furniture = [];
  ensurePlaygroundSlots();
  const editMode = !!state.pgEditMode;
  const occupied = pg.pets.filter(Boolean).length;
  const cap = playgroundCapacity();
  const furnitureHtml = pg.furniture.map(inst=>{
    const def = furnitureDef(inst.type) || {emoji:'❔', name:'가구'};
    const grabbed = pgIsGrabbed('furniture', inst.id);
    return '<div class="pg-furniture'+(grabbed?' grabbed':'')+'" style="left:'+inst.xPct+'%; top:'+inst.yPct+'%;" data-furniture="'+inst.id+'" title="'+def.name+'">'+
      '<button class="pg-furniture-remove" data-removefurniture="'+inst.id+'">'+ICONS.x+'</button>'+
      '<div class="pg-furniture-emoji">'+def.emoji+'</div>'+
    '</div>';
  }).join('');
  const petsHtml = pg.pets.map((slot,i)=>{
    const type = slot ? TYPE_MAP.get(slot.typeId) : null;
    if(!slot || !type){
      return '<div class="pg-add-pet" data-emptyslot="'+i+'">'+ICONS.park+'<div>말랑이 놓기</div></div>';
    }
    if(slot.xPct==null){ const b=pgStageBounds(); slot.xPct=randInt(b.xMin,b.xMax); slot.yPct=randInt(b.yMin,b.yMax); slot.facing=1; }
    const grabbed = pgIsGrabbed('pet', i);
    return '<div class="pg-pet-wrap'+(grabbed?' grabbed':'')+'" style="left:'+slot.xPct+'%; top:'+slot.yPct+'%;" data-tappet="'+i+'">'+
      '<button class="pg-pet-remove" data-removepet="'+i+'">'+ICONS.x+'</button>'+
      '<div class="pg-pet-bubble'+(slot.giftReady?' gift':'')+'" data-bubble="'+i+'">'+(slot.bubbleText||pgRandIdle())+'</div>'+
      '<div class="pg-pet-img-wrap" style="transform:scaleX('+(slot.facing||1)+');">'+thumbHtml(type,{size:60})+'</div>'+
    '</div>';

  const grabHint = state.pgGrabbed

function renderFusePanel(){
  const stage = currentStage();
  const req = stage.fuseReq;
  const all = req.commons.concat(req.rares, req.legendaries);
  const have = all.filter(id => (state.inventory[id]||0) >= 1).length;
  const matReady = have === all.length;
  const cost = fuseCoinCost();
  const canAfford = state.coins >= cost;
  const ready = matReady && canAfford;

  function group(title, ids){
    const items = ids.map(id=>{
      const type = TYPE_MAP.get(id);
      const owned = (state.inventory[id]||0) >= 1;
      return '<div class="fuse-item '+(owned?'have':'')+'">'+
        (owned?'<span class="fuse-check">'+ICONS.check+'</span>':'')+
        thumbHtml(type,{size:34})+
        '<div class="fname">'+type.name+'</div>'+
      '</div>';
    }).join('');
    return '<div class="fuse-group-title">'+title+' ('+ids.filter(id=>(state.inventory[id]||0)>=1).length+'/'+ids.length+')</div><div class="fuse-grid">'+items+'</div>';
  }

  const mascot = stage.mascot;
  const nextIdx = state.stageIndex+1;
  const locked = isStageLocked(nextIdx);
  let btnLabel = '퓨즈 '+mascot+' 완성하기 → 다음 단계';
  if(locked) btnLabel = (nextIdx+1)+'단계는 공사중입니다';
  else if(!matReady) btnLabel = '재료를 모두 모아주세요';
  else if(!canAfford) btnLabel = '코인이 부족합니다 ('+fmt(cost)+' 필요)';

  return '<h2>퓨즈</h2>'+
    '<div class="shop-head"><div class="lead" style="margin:0;">레어·전설 재료는 1분마다 새로 바뀌어요. 일반 '+mascot+'는 15종 모두 필요해요</div><div class="countdown" id="fuseCountdown">'+fuseCountdownText(stage)+'</div></div>'+
    '<div class="fuse-summary"><div>전체 재료 확보</div><div class="num">'+have+' / '+all.length+'</div></div>'+
    '<div class="fuse-cost">'+ICONS.coin.replace('width="18" height="18"','width="14" height="14"')+' 퓨즈 비용 <b>'+fmt(cost)+'</b> 코인 (보유 '+fmt(state.coins)+')</div>'+
    group('일반 '+mascot, req.commons)+
    group('레어 '+mascot, req.rares)+
    group('전설 '+mascot, req.legendaries)+
    '<button class="btn btn-primary fuse-cta" id="btnFuse" '+((ready&&!locked)?'':'disabled')+'>'+btnLabel+'</button>';
}

function shopCountdownText(stage){
  const remain = Math.max(0, stage.shop.nextRefresh - Date.now());
  const s = Math.floor(remain/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return mm+':'+ss;
}
function fuseCountdownText(stage){
  const remain = Math.max(0, stage.fuseNextRefresh - Date.now());
  const s = Math.floor(remain/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return mm+':'+ss;
}

/* ================= 스킨 보유 효과 (장착 여부와 무관하게 "보유"만 해도 항상 적용됨) ================= */
/* 같은 효과를 여러 개 보유하면 그 개수만큼 스텟이 중복해서 합산됨(예: 퓨즈 스킨을 3개
   보유하면 치명타 코인 획득량 +0.1%가 3번 겹쳐 +0.3%가 됨) */
function ownedFuseSkins(){ return FUSE_SKINS.slice(0, state.stageIndex); } // 0..stageIndex-1 단계는 이미 퓨즈 완성됨(보유 중)
function ownedGeneralSkins(){ return state.generalSkins || []; }
/* '무지개 x 치즈' 퓨즈 스킨의 보유 효과: 다른 퓨즈 스킨들과 달리 자동 코인 획득 대신
   놀이터 수용 인원 +1을 줌(중복 없이 딱 1개뿐인 스킨이라 항상 +1로 고정) */
const PLAYGROUND_CAPACITY_SKIN_IDS = ['fuseskin-cheese-color'];
const PLAYGROUND_CAPACITY_BONUS_PER_SKIN = 1;
function playgroundCapacityBonus(){
  return ownedFuseSkins().filter(s=> PLAYGROUND_CAPACITY_SKIN_IDS.indexOf(s.id)>=0).length * PLAYGROUND_CAPACITY_BONUS_PER_SKIN;
}
function playgroundCapacity(){ return (state.playground.capacity||1) + playgroundCapacityBonus(); }
/* 놀이터 pets 슬롯 배열을 현재 수용 인원 수만큼 늘려줌(수용 인원이 늘어나도 기존 슬롯은 그대로 유지) */
function ensurePlaygroundSlots(){
  if(!state.playground.pets) state.playground.pets = [null];
  const cap = playgroundCapacity();
  while(state.playground.pets.length < cap) state.playground.pets.push(null);
}
/* 모든 퓨즈 스킨의 보유 효과(간단 버전): 퓨즈 스킨 1개당 "현재 장착한 말랑이"의 클릭 가치의
   1%를 3초마다 자동으로 벌어줌(장착 여부와 무관하게 보유만 해도 적용, 개수만큼 중복 합산).
   예) 퓨즈 스킨 3개 보유 → 3초마다 장착 말랑이 가치의 3%를 자동 획득.
   단, '무지개 x 치즈'는 대신 놀이터 수용 인원 +1 효과를 가지므로 이 계산에서 제외됨 */
const FUSE_AUTO_INCOME_PCT_PER_SKIN = 0.01; /* 스킨 1개당 1% */
const FUSE_AUTO_INCOME_INTERVAL_MS = 3000;  /* 3초마다 */
function fuseAutoIncomePct(){
  return ownedFuseSkins().filter(s=> PLAYGROUND_CAPACITY_SKIN_IDS.indexOf(s.id)<0).length * FUSE_AUTO_INCOME_PCT_PER_SKIN;
}
/* 3초마다 실제로 지급되는 자동 획득 코인량(표시/지급 공용) */
function fuseAutoIncomeAmount(){ return Math.round(baseClickValue() * fuseAutoIncomePct()); }
/* keycap/mandu 일반 스킨의 보유 효과: 놀이터 말랑이(선물) 등장까지의 시간 1초 단축, 각각 중복 합산 */
const PLAYGROUND_SPEEDUP_SKIN_IDS = ['genskin-keycap','genskin-reality'];
const PLAYGROUND_SPEEDUP_PER_SKIN_MS = 1000;
function playgroundGiftSpeedupMs(){
  return ownedGeneralSkins().filter(g=> PLAYGROUND_SPEEDUP_SKIN_IDS.indexOf(g.id)>=0).length * PLAYGROUND_SPEEDUP_PER_SKIN_MS;
}
/* 스킨 도감/스킨 탭 카드에 표시할 보유 효과 설명 문구 */
function skinEffectText(skin){

  if(PLAYGROUND_CAPACITY_SKIN_IDS.indexOf(skin.id)>=0) return '보유 효과 · 놀이터 수용 인원 +1';
  if(skin.id && skin.id.indexOf('fuseskin-')===0) return '보유 효과 · 장착 말랑이 가치의 1%를 3초마다 자동 획득';

/* ================= SAVE CODE SYSTEM ================= */
/* 한글 등 유니코드가 섞여도 안전하게 base64로 인코딩/디코딩하기 위한 헬퍼 */
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }
const SAVE_CODE_PREFIX = 'MDSAVE1:';
function exportSaveCode(){
  const payload = {
    v:1,
    coins: state.coins,
    gems: state.gems,
    ticketsRare: state.ticketsRare,
    ticketsLegendary: state.ticketsLegendary,
    mileage: state.mileage,
    stageIndex: state.stageIndex,
    inventory: state.inventory,
    dex: Array.from(state.dex),
    equippedId: state.equippedId,
    equippedSkinId: state.equippedSkinId,
    generalSkins: state.generalSkins||[],
    redeemedCodes: Array.from(state.redeemedCodes||[]),
    settings: state.settings,
    playground: state.playground
  };
  return SAVE_CODE_PREFIX + b64EncodeUnicode(JSON.stringify(payload));
}
function importSaveCode(code){
  try{
    const raw = code.slice(SAVE_CODE_PREFIX.length);
    const payload = JSON.parse(b64DecodeUnicode(raw));
    if(!payload || payload.v!==1) return false;
    state.coins = payload.coins||0;
    state.gems = payload.gems||0;
    state.ticketsRare = payload.ticketsRare||0;
    state.ticketsLegendary = payload.ticketsLegendary||0;
    state.mileage = payload.mileage||{};
    state.stageIndex = payload.stageIndex||0;
    state.inventory = payload.inventory||{};
    state.dex = new Set(payload.dex||[]);
    state.equippedId = payload.equippedId||null;
    state.equippedSkinId = payload.equippedSkinId||null;
    state.generalSkins = payload.generalSkins||[];
    state.redeemedCodes = new Set(payload.redeemedCodes||[]);
    if(payload.settings) state.settings = Object.assign({muted:false, volume:0.85, playgroundAlarmMuted:false, shopMerchantAlarmMuted:false}, payload.settings);
    state.playground = payload.playground || { capacity:1, pets:[null], furniture:[] };
    if(!state.playground.furniture) state.playground.furniture = [];
    state.gachaStageView = state.stageIndex;
    state.dexStageView = state.stageIndex;
    reschedulePlaygroundTimers();
    return true;
  }catch(e){ return false; }
}
/* 코드 입력란은 하나로 이벤트 코드('mandu')와 세이브 코드(MDSAVE1:...) 둘 다 받음.
   설정 탭과 상점 탭 둘 다 각자 입력란(id)을 가지므로 어느 쪽에서 호출했는지 인자로 받음 */
function submitCode(inputId){
  const inputEl = document.getElementById(inputId||'codeInput');
  if(!inputEl) return;
  const raw = (inputEl.value||'').trim();
  if(!raw){ toast('코드를 입력해주세요'); return; }
  if(raw.startsWith(SAVE_CODE_PREFIX)){
    const ok = importSaveCode(raw);
    if(ok){
      toast('세이브를 불러왔습니다');
      inputEl.value='';
      initStageRuntime(state.stageIndex);
      tintHero();
      renderAll();
    } else {
      toast('세이브 코드를 불러오지 못했습니다');
    }
    return;
  }
  if(raw.toLowerCase()==='mandu'){
    if(!state.redeemedCodes) state.redeemedCodes = new Set();
    if(state.redeemedCodes.has('mandu')){ toast('이미 사용한 코드입니다'); return; }
    createRealitySkin();
    inputEl.value='';
    return;
  }
  if(raw.toLowerCase()==='keycap'){
    if(!state.redeemedCodes) state.redeemedCodes = new Set();
    if(state.redeemedCodes.has('keycap')){ toast('이미 사용한 코드입니다'); return; }
    createKeycapSkin();
    inputEl.value='';
    return;
  }
  if(raw.toLowerCase()==='party'){
    spawnPartyBonusMallangs();
    toast('파티 타임! 클릭 보너스 말랑이 3마리 등장');
    inputEl.value='';
    return;
  }
  toast('유효하지 않은 코드입니다');
}
/* party 코드: 보상을 지급하는 코드가 아니라 즉시 효과(액션)를 발동시키는 코드라서
   한 번 쓴 뒤에도 다시 입력하면 몇 번이든 재사용할 수 있음(redeemedCodes에 기록 안 함).
   기존의 랜덤 등장 보너스 말랑이(#bonusMallang)와 별개로, 화면에 임시 보너스 말랑이
   3마리를 동시에 띄움. 각각은 기존 보너스 말랑이와 동일하게 소지금의 30~50%를 주고,
   누르거나 일정 시간이 지나면 사라짐(기존 랜덤 등장 스케줄에는 영향 없음) */
function spawnPartyBonusMallang(){
  const el = document.createElement('div');
  el.className = 'bonus-mallang show party-bonus-mallang';
  el.innerHTML = '<div class="bonus-mallang-glow"></div><img alt="보너스 말랑이"><div class="bonus-mallang-tag">TAP!</div>';
  const img = el.querySelector('img');
  const skin = getEquippedSkin();
  const eq = getEquippedType();
  const visual = skin || eq;
  img.src = visual ? imgFor(visual) : currentStage().img;
  img.style.filter = visual ? filterFor(visual) : 'saturate(1.3)';
  const st = skinStyle(skin);
  if(st==='rainbow') img.classList.add('rainbow-img');
  else if(st==='cosmic') img.classList.add('cosmic-img');
  else if(st==='galaxy') img.classList.add('galaxy-img');
  else if(!skin && eq && eq.rainbowEffect) img.classList.add('rainbow-img');
  if(st==='galaxy') img.style.setProperty('--ghue', ghueDeg(skin)+'deg');
  document.body.appendChild(el);
  const size = 76, margin = 12;
  const topMin = 110;
  const topMax = Math.max(topMin+40, window.innerHeight-170);
  const leftMax = Math.max(margin, window.innerWidth-size-margin);
  el.style.left = randInt(margin, leftMax)+'px';
  el.style.top = randInt(topMin, topMax)+'px';
  let removed = false;
  const remove = ()=>{
    if(removed) return; removed = true;
    el.classList.add('leaving');
    setTimeout(()=> el.remove(), 280);
  };
  const hideTimer = setTimeout(remove, BONUS_VISIBLE_MS);
  el.addEventListener('click', ()=>{
    if(removed) return;
    ensureAudio();
    const pct = BONUS_MIN_PCT + Math.random()*(BONUS_MAX_PCT-BONUS_MIN_PCT);
    const gain = Math.max(0, Math.round(state.coins*pct));
    state.coins += gain;
    playChime('legendary');
    toast('보너스 말랑이! 소지금의 '+Math.round(pct*100)+'% · +'+fmt(gain)+' 코인');
    const rect = el.getBoundingClientRect();
    const span = document.createElement('div');
    span.className = 'float-coin crit';
    span.style.position = 'fixed';
    span.style.left = (rect.left + rect.width/2 - 10) + 'px';
    span.style.top = rect.top + 'px';
    span.style.zIndex = 95;
    span.textContent = '+'+fmt(gain);
    document.body.appendChild(span);
    setTimeout(()=> span.remove(), 950);
    renderHeader();
    clearTimeout(hideTimer);
    remove();
  });
}
function spawnPartyBonusMallangs(){
  for(let i=0;i<3;i++) spawnPartyBonusMallang();
}
/* keycap 코드: 기계식 키보드 스위치 사진으로 만든 '일반 스킨'. 원본이 흰 배경이라
   다른 이미지들과 동일하게 blend-photo(mix-blend-mode:multiply) 렌더링을 그대로 타서
   흰 배경이 원형 테마 배경색과 섞여 자연스럽게 사라짐. 장착 후 클릭할 때마다
   playPop()이 이 스킨의 customMascot('키캡')을 보고 playKeycapClack()으로 분기해서
   기계식 키보드가 '타다닥' 두드리는 듯한 전용 효과음을 냄 */
function createKeycapSkin(){
  if(!state.redeemedCodes) state.redeemedCodes = new Set();
  state.redeemedCodes.add('keycap');
  const skin = {
    id:'genskin-keycap',
    name:'키캡 말랑이',
    desc:'keycap 코드로 얻은 기계식 스위치 스킨',

        onFurnitureClick(el.dataset.furniture);
      };
    });
    document.querySelectorAll('[data-removefurniture]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); removeFurniture(el.dataset.removefurniture); };
    });
    if(byId('btnPgShop')) byId('btnPgShop').onclick = ()=>{ ensureAudio(); openPlaygroundShop(); };
    if(byId('btnPgEdit')) byId('btnPgEdit').onclick = ()=>{
      ensureAudio();

      state.pgGrabbed = null;
      renderPanel();

    });

      btn.onclick = ()=>{

        state.equippedSkinId = (state.equippedSkinId===id) ? null : id;

      state.settings.muted = !state.settings.muted;
      if(!state.settings.muted) ensureAudio();

    if(byId('btnGenerateSave')) byId('btnGenerateSave').onclick = generateSaveCode;

  }
}
